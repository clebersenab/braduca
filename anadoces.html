<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitrine Ana Doces</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: single mobile-first column (max 560px) — creator header, e-book list, e-book page, 3-step checkout. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#EEF3FA; --ink:#16274A; --muted:#5A6882; --line:#DCE4F0;
  --brand-a:#5B8FD6; --brand-b:#16274A; --accent:#16274A; --accent-ink:#FFFFFF;
  --gold:#F4C63F; --gold-ink:#16274A; --good:#1E8B5A; --good-soft:#DDF3E8; --bad:#B3261E; --bad-soft:#FBE3E1; --warn-soft:#FBEFD2;
  --f:"Montserrat","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1530; --surface:#132346; --surface-2:#1A2D57; --ink:#EAF0FA; --muted:#A3B1C9; --line:#26396A;
    --accent:#F4C63F; --accent-ink:#16274A; --good:#5FD39C; --good-soft:#163D2E; --bad:#F2867E; --bad-soft:#44201F; --warn-soft:#3D3115;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1530; --surface:#132346; --surface-2:#1A2D57; --ink:#EAF0FA; --muted:#A3B1C9; --line:#26396A;
  --accent:#F4C63F; --accent-ink:#16274A; --good:#5FD39C; --good-soft:#163D2E; --bad:#F2867E; --bad-soft:#44201F; --warn-soft:#3D3115;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; line-height:1.15; letter-spacing:-.02em; text-wrap:balance}
p{margin:0}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.page{max-width:560px; margin:0 auto; padding-bottom:40px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.demo{display:flex; justify-content:center; gap:8px; padding:8px 0; font-size:.76rem; font-weight:600; color:var(--muted)}
.demo b{background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:1px 8px}

/* creator header */
.cover{height:150px; border-radius:22px; background:linear-gradient(135deg, var(--brand-a), var(--brand-b)); position:relative; overflow:hidden}
.cover svg{position:absolute; right:26px; top:28px; width:56px}
.who{padding:0 6px; margin-top:-44px; position:relative}
.av{width:88px; height:88px; border-radius:50%; border:5px solid var(--bg); background:var(--brand-b); color:#fff; display:grid; place-items:center; font-weight:900; font-size:28px}
.who h1{font-size:1.6rem; font-weight:900; margin-top:8px}
.who .bio{color:var(--muted); margin-top:6px; max-width:52ch}
.social{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.social a{font-size:.8rem; font-weight:700; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:6px 12px; text-decoration:none}
.sect{margin-top:26px; display:grid; gap:12px}
.eb-main{display:grid; gap:12px}
.eb-main .rec{margin-top:0}
.sect h2{font-size:1.05rem; font-weight:800}

/* list */
.item{display:grid; grid-template-columns:120px minmax(0,1fr); background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; cursor:pointer; text-align:left; padding:0; width:100%; transition:transform .2s, box-shadow .2s}
.item:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(15,30,61,.1)}
.item img{width:100%; height:100%; min-height:110px; object-fit:cover}
.item .b{padding:12px 14px; display:grid; gap:6px; align-content:center}
.item b{font-size:.95rem; line-height:1.25}
.item .meta{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
.price{font-weight:900; font-size:1.05rem}
.tagv{font-size:.72rem; font-weight:800; color:var(--good); background:var(--good-soft); border-radius:99px; padding:2px 8px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:14px; padding:14px 18px; font-weight:800; font-size:.95rem; cursor:pointer; text-decoration:none}
.btn-buy{background:var(--gold); color:var(--gold-ink); box-shadow:0 6px 0 -1px #D99A0B}
.btn-buy:active{transform:translateY(3px); box-shadow:0 3px 0 -1px #D99A0B}
.btn-dark{background:var(--accent); color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.btn-sm{padding:8px 12px; font-size:.82rem; border-radius:10px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.full{width:100%}
.trust{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; font-size:.76rem; color:var(--muted); font-weight:600; margin-top:6px}
.foot{margin-top:34px; text-align:center; font-size:.76rem; color:var(--muted); display:grid; gap:6px; justify-items:center}
.foot img{height:20px; width:auto; opacity:.8}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .foot img{filter:brightness(0) invert(1)} }
:root[data-theme="dark"] .foot img{filter:brightness(0) invert(1)}

/* ebook page */
.back{border:0; background:none; font-weight:700; color:var(--muted); cursor:pointer; padding:10px 0; display:inline-flex; gap:6px}
.hero{border-radius:20px; overflow:hidden; background:var(--surface); border:1px solid var(--line)}
.hero img{width:100%; aspect-ratio:16/9; object-fit:cover}
.hero .b{padding:16px; display:grid; gap:8px}
.hero h1{font-size:1.4rem; font-weight:900}
.rec{display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:14px; padding:10px 12px; font-size:.84rem}
.rec .mini{width:34px; height:34px; border-radius:50%; background:var(--brand-b); color:#fff; display:grid; place-items:center; font-weight:900; font-size:12px; flex:none}
.box{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; display:grid; gap:10px}
.box h3{font-size:.98rem; font-weight:800}
.learn{margin:0; padding:0; list-style:none; display:grid; gap:8px}
.learn li{display:grid; grid-template-columns:22px 1fr; gap:8px; font-size:.9rem}
.learn li::before{content:"✓"; width:22px; height:22px; border-radius:50%; background:var(--good-soft); color:var(--good); display:grid; place-items:center; font-weight:900; font-size:.75rem}
.inc{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.inc div{background:var(--surface-2); border-radius:14px; padding:12px; font-size:.84rem}
.inc b{display:block; font-size:.9rem}
.sticky{position:sticky; bottom:0; padding-block:12px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, var(--bg) 22%); display:grid; gap:6px; margin-top:8px}
.sticky .row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:10px 10px 10px 16px; box-shadow:0 10px 30px rgba(15,30,61,.12)}
.sticky .row .price{flex:1}
.sticky .row small{display:block; font-size:.72rem; color:var(--muted); font-weight:600}

/* checkout */
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:6px 0 4px}
.steps li{list-style:none; font-size:.72rem; font-weight:800; color:var(--muted); padding-top:10px; position:relative}
.steps li::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; border-radius:99px; background:var(--line)}
.steps li.on{color:var(--ink)}
.steps li.on::before{background:var(--gold)}
.steps ol{margin:0; padding:0}
.order{display:grid; grid-template-columns:72px minmax(0,1fr) auto; gap:12px; align-items:center}
.order img{width:72px; height:48px; border-radius:10px; object-fit:cover}
.order b{font-size:.88rem; line-height:1.25}
.field{display:grid; gap:6px}
.field label{font-size:.8rem; font-weight:700; color:var(--muted)}
.field input,.field select{width:100%; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:12px 13px; color:var(--ink)}
.field input:focus{outline:none; border-color:var(--brand-a)}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad); font-size:.78rem; font-weight:700}
.two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.check{display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:start; font-size:.84rem; background:var(--surface-2); border-radius:12px; padding:12px; cursor:pointer}
.check input{width:20px; height:20px; accent-color:var(--brand-b); margin:0}
.pay{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.pay button{display:grid; gap:2px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer}
.pay button b{font-size:.95rem}
.pay button small{color:var(--muted); font-size:.76rem}
.pay button[aria-checked="true"]{border-color:var(--brand-a); box-shadow:0 0 0 3px rgba(91,143,214,.2)}
.pix{display:grid; justify-items:center; gap:10px; text-align:center}
.qr{background:#fff; border-radius:16px; padding:12px; border:1px solid var(--line)}
.qr svg{display:block; width:190px; height:190px}
.code{display:flex; gap:8px; width:100%; background:var(--surface-2); border-radius:12px; padding:8px 8px 8px 12px; align-items:center}
.code code{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.78rem}
.timer{font-weight:800; font-size:.9rem}
.wait{display:flex; align-items:center; gap:8px; font-size:.84rem; color:var(--muted); font-weight:600}
.spin{width:14px; height:14px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--brand-a); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{background:var(--bad-soft); color:var(--bad); border-radius:12px; padding:10px 12px; font-size:.84rem; font-weight:700}
.hint{background:var(--warn-soft); border-radius:12px; padding:8px 12px; font-size:.76rem; color:var(--ink)}
.done{display:grid; justify-items:center; text-align:center; gap:10px; padding:10px 0}
.done .ok{width:64px; height:64px; border-radius:50%; background:var(--good-soft); color:var(--good); display:grid; place-items:center; font-size:30px; font-weight:900; animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.6); opacity:0}to{transform:none; opacity:1}}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:700; font-size:.86rem; z-index:50}

.muted{color:var(--muted)}
.cat{font-size:.72rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.items{display:grid; gap:12px}
.item .desc{display:none}
.only-lg{display:none}
.price.big{font-size:1.9rem; letter-spacing:-.02em}
.buybox{gap:12px}
.summary{gap:8px}
.sum-img{width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px}
.sum-line{display:flex; justify-content:space-between; gap:10px; font-size:.86rem; color:var(--muted); border-top:1px solid var(--line); padding-top:8px}
.sum-line.total{color:var(--ink); font-weight:900; font-size:1.05rem}
@media (min-width: 900px){
  .page{max-width:1120px}
  .demo{justify-content:flex-start}
  .only-sm{display:none !important}
  .only-lg{display:block}
  .home{display:grid; grid-template-columns:320px minmax(0,1fr); gap:0 40px; align-items:start}
  .home .cover{grid-column:1 / -1; height:220px; border-radius:28px}
  .home .who{margin-top:-60px; position:sticky; top:20px; padding:0 0 0 24px}
  .home .av{width:116px; height:116px; font-size:36px}
  .home .who h1{font-size:2rem}
  .home .list{margin-top:28px}
  .home .list h2{font-size:1.3rem}
  .items{grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
  .item{grid-template-columns:minmax(0,1fr); grid-template-rows:auto 1fr}
  .item img{aspect-ratio:16/9; min-height:0; height:auto}
  .item .b{padding:16px 18px 18px; align-content:start; gap:8px}
  .item b{font-size:1.05rem}
  .item .desc{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--muted); font-size:.86rem}
  .ebook{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; align-items:start}
  .eb-main{display:grid; gap:16px}
  .eb-main .hero h1{font-size:1.9rem}
  .eb-main .hero .b{padding:22px}
  .eb-side{position:sticky; top:20px}
  .co{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; align-items:start; max-width:960px}
  .co-side{position:sticky; top:20px; margin-top:32px}
  .narrow{max-width:620px; margin:0 auto}
  .foot{margin-top:56px}
}

@media (max-width: 420px){ .item{grid-template-columns:100px minmax(0,1fr)} .two{grid-template-columns:minmax(0,1fr)} .inc{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

</head>

const INCLUDES = [["E-book completo","Para ler no celular ou no computador"],["Vídeos do autor","Explicando as partes principais"],["Acesso na hora","Chega no seu e-mail e WhatsApp"],["Garantia de 7 dias","Não gostou? Devolvemos o valor"]];

const Wing = () => html`<svg viewBox="0 0 196 292" aria-hidden="true"><path d="M0 178 L0 0 A178 178 0 0 1 178 178 Z" fill="#E2A312"/><path d="M0 178 L114 178 A114 114 0 0 1 0 292 Z" fill="#F4C63F"/></svg>`;
const initials = n => n.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
async function copy(text, toast){ try { await navigator.clipboard.writeText(text); toast("Copiado"); } catch(e){ toast("Selecione o texto e copie"); } }

function QR({ text }){
  const svg = useMemo(() => { try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize:4, margin:0, scalable:true }); } catch(e){ return ""; } }, [text]);
  return html`<div className="qr" dangerouslySetInnerHTML=${{ __html:svg }}></div>`;
}

/* ===== Vitrine ===== */
function Home({ open }){
  return html`<div className="home">
    <div className="cover"><${Wing} /></div>
    <aside className="who">
      <div className="av">${initials(CREATOR.name)}</div>
      <h1>${CREATOR.name}</h1>
      <p className="bio">${CREATOR.bio}</p>
      <div className="social">
        <a href=${"https://instagram.com/" + CREATOR.insta} target="_blank" rel="noopener">Instagram @${CREATOR.insta}</a>
        <a href=${"https://tiktok.com/@" + CREATOR.tiktok} target="_blank" rel="noopener">TikTok @${CREATOR.tiktok}</a>
      </div>
    </aside>
    <section className="sect list">
      <h2>E-books que eu indico</h2>
      <div className="items">${CREATOR.ids.map(id => html`<button key=${id} className="item" onClick=${() => open(id)}>
        <img src=${cover(id)} alt="" />
        <div className="b"><span className="cat">${EB[id].c}</span><b>${EB[id].t}</b><p className="desc">${EB[id].d}</p><div className="meta"><span className="price">${brl(PRICE)}</span><span className="tagv">+ vídeos do autor</span></div></div>
      </button>`)}</div>
    </section>
  </div>`;
}

function BuyBox({ buy }){
  return html`<div className="box buybox">
    <span className="price big">${brl(PRICE)}</span><small className="muted">Pagamento único · Pix ou cartão</small>
    <button className="btn btn-buy full" onClick=${buy}>Comprar agora</button>
    <div className="rec"><span className="mini">${initials(CREATOR.name)}</span><span><b>${CREATOR.name}</b> indica este e-book.</span></div>
    <p className="trust"><span>🔒 Compra segura</span><span>Garantia de 7 dias</span></p>
  </div>`;
}
function Ebook({ id, back, buy }){
  const e = EB[id];
  return html`
    <button className="back" onClick=${back}>← Vitrine da ${CREATOR.name.split(" ")[0]}</button>
    <div className="ebook">
      <div className="eb-main">
        <div className="hero"><img src=${cover(id)} alt=${"Capa do e-book " + e.t} />
          <div className="b"><span className="cat">${e.c}</span><h1>${e.t}</h1><p className="muted">${e.d}</p></div>
        </div>
        <div className="rec only-sm"><span className="mini">${initials(CREATOR.name)}</span><span><b>${CREATOR.name}</b> indica este e-book.</span></div>
        <div className="box"><h3>O que você vai aprender</h3><ul className="learn">${e.learn.map(l => html`<li key=${l}>${l}</li>`)}</ul></div>
        <div className="box"><h3>O que está incluído</h3><div className="inc">${INCLUDES.map(([t, s]) => html`<div key=${t}><b>${t}</b>${s}</div>`)}</div></div>
      </div>
      <aside className="eb-side only-lg"><${BuyBox} buy=${buy} /></aside>
    </div>
    <div className="sticky only-sm">
      <div className="row"><div className="price">${brl(PRICE)}<small>pagamento único · Pix ou cartão</small></div><button className="btn btn-buy" onClick=${buy}>Comprar agora</button></div>
    </div>`;
}

/* ===== Checkout ===== */
const onlyDigits = v => v.replace(/\D/g, "");
const phoneMask = v => { const d = onlyDigits(v).slice(0, 11); if (d.length <= 2) return d; if (d.length <= 7) return "(" + d.slice(0, 2) + ") " + d.slice(2); return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7); };
const cpfMask = v => onlyDigits(v).slice(0, 11).replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
const cardMask = v => onlyDigits(v).slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
const expMask = v => { const d = onlyDigits(v).slice(0, 4); return d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d; };

function Steps({ n }){
  return html`<ol className="steps" aria-label="Etapas da compra">${["Seus dados","Pagamento","Pronto"].map((t, i) => html`<li key=${t} className=${i <= n ? "on" : ""} aria-current=${i === n ? "step" : undefined}>${t}</li>`)}</ol>`;
}
function Order({ id }){
  return html`<div className="box order"><img src=${cover(id)} alt="" /><div style=${{ minWidth:0 }}><b>${EB[id].t}</b><div style=${{ fontSize:".76rem", color:"var(--muted)" }}>Indicado por ${CREATOR.name}</div></div><span className="price num">${brl(PRICE)}</span></div>`;
}

function Summary({ id }){
  return html`<div className="box summary">
    <h3>Resumo do pedido</h3>
    <img src=${cover(id)} alt="" className="sum-img" />
    <b>${EB[id].t}</b>
    <small className="muted">Indicado por ${CREATOR.name}</small>
    <div className="sum-line"><span>E-book + vídeos do autor</span><span className="num">${brl(PRICE)}</span></div>
    <div className="sum-line total"><span>Total</span><span className="num">${brl(PRICE)}</span></div>
    <p className="trust" style=${{ justifyContent:"flex-start" }}><span>🔒 Compra segura</span><span>Garantia de 7 dias</span></p>
  </div>`;
}
function Dados({ id, data, setData, next, back }){
  const [touched, setTouched] = useState(false);
  const errs = {
    name:data.name.trim().split(/\s+/).length < 2 ? "Digite nome e sobrenome." : "",
    phone:onlyDigits(data.phone).length < 10 ? "Digite o WhatsApp com DDD." : "",
    email:!/^\S+@\S+\.\S+$/.test(data.email) ? "Digite um e-mail válido." : "",
    cpf:data.cpf && onlyDigits(data.cpf).length !== 11 ? "O CPF tem 11 números." : ""
  };
  const ok = !Object.values(errs).some(Boolean);
  const set = k => e => setData({ ...data, [k]:k === "phone" ? phoneMask(e.target.value) : k === "cpf" ? cpfMask(e.target.value) : e.target.value });
  const F = ({ k, label, type = "text", ph, mode, ac }) => html`<div className="field"><label htmlFor=${"f" + k}>${label}</label><input id=${"f" + k} type=${type} inputMode=${mode} autoComplete=${ac} placeholder=${ph} value=${data[k]} onInput=${set(k)} aria-invalid=${touched && !!errs[k]} />${touched && errs[k] ? html`<span className="err">${errs[k]}</span>` : null}</div>`;
  return html`
    <button className="back" onClick=${back}>← Voltar</button>
    <div className="co"><div className="co-main">
    <${Steps} n=${0} />
    <div className="sect" style=${{ marginTop:"12px" }}>
      <div className="only-sm"><${Order} id=${id} /></div>
      <div className="box">
        <h3>Para onde enviamos seu e-book?</h3>
        ${F({ k:"name", label:"Nome completo", ac:"name" })}
        <div className="two">
          ${F({ k:"phone", label:"WhatsApp", mode:"tel", ph:"(85) 99999-9999", ac:"tel" })}
          ${F({ k:"email", label:"E-mail", type:"email", ac:"email" })}
        </div>
        ${F({ k:"cpf", label:"CPF na nota (opcional)", mode:"numeric", ph:"000.000.000-00" })}
        <label className="check"><input type="checkbox" checked=${data.consent} onChange=${e => setData({ ...data, consent:e.target.checked })} /><span>Aceito receber mensagens no WhatsApp sobre minha compra, inclusive de ${CREATOR.name}.</span></label>
      </div>
      <button className="btn btn-buy full" onClick=${() => { setTouched(true); if (ok) next(); }}>Ir para o pagamento</button>
      <p className="trust only-sm"><span>🔒 Compra segura</span><span>Garantia de 7 dias</span></p>
    </div></div>
    <aside className="co-side only-lg"><${Summary} id=${id} /></aside></div>`;
}

const PIX_CODE = "00020126580014BR.GOV.BCB.PIX0136braduca-exemplo-pix-0000000000005204000053039865405" + "29.905802BR5915BRADUCA EXEMPLO6009FORTALEZA62070503***6304ABCD";
function Pagamento({ id, data, done, back, toast }){
  const [method, setMethod] = useState("pix");
  const [pixOn, setPixOn] = useState(false);
  const [secs, setSecs] = useState(30 * 60);
  const [card, setCard] = useState({ num:"", exp:"", cvv:"", holder:"" });
  const [state, setState] = useState("idle");
  useEffect(() => { if (!pixOn) return; const t = setInterval(() => setSecs(s => Math.max(0, s - 1)), 1000); return () => clearInterval(t); }, [pixOn]);
  useEffect(() => { if (state !== "checking") return; const t = setTimeout(() => setState("idle") || done(method), 1600); return () => clearTimeout(t); }, [state]);
  const mm = String(Math.floor(secs / 60)).padStart(2, "0"), ss = String(secs % 60).padStart(2, "0");
  const cardOk = onlyDigits(card.num).length === 16 && /^\d{2}\/\d{2}$/.test(card.exp) && onlyDigits(card.cvv).length >= 3 && card.holder.trim().length > 3;
  const payCard = () => {
    if (!cardOk) return;
    setState("processing");
    setTimeout(() => { if (onlyDigits(card.num).endsWith("0000")) setState("declined"); else { setState("idle"); done("cartao"); } }, 1400);
  };
  return html`
    <button className="back" onClick=${back}>← Voltar para seus dados</button>
    <div className="co"><div className="co-main">
    <${Steps} n=${1} />
    <div className="sect" style=${{ marginTop:"12px" }}>
      <div className="only-sm"><${Order} id=${id} /></div>
      <div className="pay" role="radiogroup" aria-label="Forma de pagamento">
        <button role="radio" aria-checked=${method === "pix"} onClick=${() => setMethod("pix")}><b>Pix</b><small>Aprovação na hora</small></button>
        <button role="radio" aria-checked=${method === "cartao"} onClick=${() => setMethod("cartao")}><b>Cartão de crédito</b><small>À vista</small></button>
      </div>
      ${method === "pix" ? html`<div className="box">
        ${!pixOn ? html`<${React.Fragment}>
          <h3>Pagar com Pix</h3><p style=${{ fontSize:".88rem", color:"var(--muted)" }}>Geramos um código para você pagar no app do seu banco. O e-book chega assim que o pagamento cair.</p>
          <button className="btn btn-buy full" onClick=${() => setPixOn(true)}>Gerar Pix de ${brl(PRICE)}</button>
        </${React.Fragment}>` : html`<div className="pix">
          <h3>Pague ${brl(PRICE)} com Pix</h3>
          <${QR} text=${PIX_CODE} />
          <div className="code"><code>${PIX_CODE}</code><button className="btn btn-dark btn-sm" onClick=${() => copy(PIX_CODE, toast)}>Copiar código</button></div>
          <p className="timer num">O código vale por ${mm}:${ss}</p>
          ${state === "checking" ? html`<p className="wait"><span className="spin"></span>Confirmando o pagamento…</p>` : html`<p className="wait"><span className="spin"></span>Esperando o pagamento. Esta tela atualiza sozinha.</p>`}
          <div className="hint">Protótipo: toque abaixo para simular o pagamento.</div>
          <button className="btn btn-ghost btn-sm" disabled=${state === "checking"} onClick=${() => setState("checking")}>Simular pagamento do Pix</button>
        </div>`}
      </div>` : html`<div className="box">
        <h3>Dados do cartão</h3>
        ${state === "declined" ? html`<div className="alert" role="alert">O banco recusou o pagamento. Confira os dados, use outro cartão ou pague com Pix.</div>` : null}
        <div className="field"><label htmlFor="cn">Número do cartão</label><input id="cn" inputMode="numeric" autoComplete="cc-number" value=${card.num} placeholder="0000 0000 0000 0000" onInput=${e => setCard({ ...card, num:cardMask(e.target.value) })} /></div>
        <div className="two">
          <div className="field"><label htmlFor="ce">Validade</label><input id="ce" inputMode="numeric" autoComplete="cc-exp" placeholder="MM/AA" value=${card.exp} onInput=${e => setCard({ ...card, exp:expMask(e.target.value) })} /></div>
          <div className="field"><label htmlFor="cv">Código de segurança</label><input id="cv" inputMode="numeric" autoComplete="cc-csc" placeholder="CVV" value=${card.cvv} onInput=${e => setCard({ ...card, cvv:onlyDigits(e.target.value).slice(0, 4) })} /></div>
        </div>
        <div className="field"><label htmlFor="ch">Nome impresso no cartão</label><input id="ch" autoComplete="cc-name" value=${card.holder} onInput=${e => setCard({ ...card, holder:e.target.value.toUpperCase() })} /></div>
        <div className="hint">Protótipo: não digite um cartão real. Um número terminado em 0000 simula recusa.</div>
        <button className="btn btn-buy full" disabled=${!cardOk || state === "processing"} onClick=${payCard}>${state === "processing" ? "Processando…" : "Pagar " + brl(PRICE)}</button>
      </div>`}
      <p className="trust"><span>🔒 Compra segura</span><span>Garantia de 7 dias</span><span>Nota fiscal no seu e-mail</span></p>
    </div></div>
    <aside className="co-side only-lg"><${Summary} id=${id} /></aside></div>`;
}

function Pronto({ id, data, method, home, toast }){
  const first = data.name.split(" ")[0];
  return html`
    <div className="narrow">
    <${Steps} n=${2} />
    <div className="sect" style=${{ marginTop:"12px" }}>
      <div className="box done">
        <span className="ok">✓</span>
        <h1 style=${{ fontSize:"1.4rem" }}>Compra confirmada, ${first}!</h1>
        <p style=${{ color:"var(--muted)", maxWidth:"40ch" }}>Pagamento ${method === "pix" ? "via Pix" : "no cartão"} aprovado. Enviamos o acesso para <b>${data.email}</b> e para o seu WhatsApp.</p>
      </div>
      <${Order} id=${id} />
      <div className="box">
        <h3>Comece agora</h3>
        <button className="btn btn-buy full" onClick=${() => toast("Leitor disponível na versão final")}>Abrir o e-book</button>
        <button className="btn btn-ghost full" onClick=${() => toast("Vídeos disponíveis na versão final")}>Assistir aos vídeos do autor</button>
        <p style=${{ fontSize:".8rem", color:"var(--muted)" }}>A nota fiscal chega no seu e-mail. Se não gostar, você pode pedir o reembolso em até 7 dias.</p>
      </div>
      <button className="btn btn-ghost full" onClick=${home}>Ver outros e-books da ${CREATOR.name.split(" ")[0]}</button>
    </div></div>`;
}

/* ===== App ===== */
function App(){
  const [view, setView] = useState({ v:"home" });
  const [data, setData] = useState({ name:"", phone:"", email:"", cpf:"", consent:false });
  const [msg, setMsg] = useState("");
  const tRef = useRef();
  const toast = m => { setMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setMsg(""), 2200); };
  const go = v => { setView(v); window.scrollTo(0, 0); };
  let body;
  if (view.v === "home") body = html`<${Home} open=${id => go({ v:"ebook", id })} />`;
  else if (view.v === "ebook") body = html`<${Ebook} id=${view.id} back=${() => go({ v:"home" })} buy=${() => go({ v:"dados", id:view.id })} />`;
  else if (view.v === "dados") body = html`<${Dados} id=${view.id} data=${data} setData=${setData} back=${() => go({ v:"ebook", id:view.id })} next=${() => go({ v:"pagamento", id:view.id })} />`;
  else if (view.v === "pagamento") body = html`<${Pagamento} id=${view.id} data=${data} toast=${toast} back=${() => go({ v:"dados", id:view.id })} done=${m => go({ v:"pronto", id:view.id, method:m })} />`;
  else body = html`<${Pronto} id=${view.id} data=${data} method=${view.method} toast=${toast} home=${() => go({ v:"home" })} />`;
  return html`<div className="page">
    <div className="demo"><b>Protótipo</b>Vitrine de exemplo · braduca.com.br/${CREATOR.handle}</div>
    ${body}
    <footer className="foot"><img src=${IMG.logo_n} alt="Braduca" /><span>Vendido e entregue pela Braduca. Pagamento processado com segurança.</span></footer>
    ${msg ? html`<div className="toast" role="status">${msg}</div>` : null}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>

</body>
</html>
