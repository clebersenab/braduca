<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loja Braduca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: sticky store header; content column max 1200px; grids of e-book cards (Udemy-like density) with Domestika-like visual hero and category tiles. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EEF3FA; --ink:#16274A; --muted:#5A6882; --line:#DCE4F0;
  --navy:#16274A; --navy-2:#0F1E3D; --sky:#5B8FD6; --gold:#F4C63F; --gold-d:#D99A0B; --gold-ink:#16274A; --gold-soft:#FCEFC4;
  --accent:#16274A; --accent-ink:#FFFFFF; --link:#3F77C8;
  --good:#1E8B5A; --good-soft:#DDF3E8; --bad:#B3261E; --bad-soft:#FBE3E1; --warn-soft:#FBEFD2; --star:#C98A00;
  --f:"Montserrat","Helvetica Neue",Arial,system-ui,sans-serif; --read:"Merriweather",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1530; --surface:#132346; --surface-2:#1A2D57; --ink:#EAF0FA; --muted:#A3B1C9; --line:#26396A;
    --accent:#F4C63F; --accent-ink:#16274A; --link:#8FB3E8; --gold-soft:#3A3318;
    --good:#5FD39C; --good-soft:#163D2E; --bad:#F2867E; --bad-soft:#44201F; --warn-soft:#3D3115; --star:#F4C63F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1530; --surface:#132346; --surface-2:#1A2D57; --ink:#EAF0FA; --muted:#A3B1C9; --line:#26396A;
  --accent:#F4C63F; --accent-ink:#16274A; --link:#8FB3E8; --gold-soft:#3A3318;
  --good:#5FD39C; --good-soft:#163D2E; --bad:#F2867E; --bad-soft:#44201F; --warn-soft:#3D3115; --star:#F4C63F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--navy-2)}
h1,h2,h3{margin:0; line-height:1.15; letter-spacing:-.02em; text-wrap:balance}
p{margin:0}
button,input,select{font:inherit; color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1200px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* header */
.hdr{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--navy-2); color:#fff}
.hdr .wrap{display:flex; align-items:center; gap:14px; height:64px}
.logo{display:flex; align-items:center; gap:8px; border:0; background:none; cursor:pointer; padding:0}
.logo img{height:24px; width:auto}
.logo span{font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--gold); color:var(--gold-ink)}
.catbtn{border:0; background:none; color:#C9D6EC; font-weight:700; cursor:pointer; padding:8px 6px}
.search{flex:1; display:flex; align-items:center; background:#fff; border-radius:99px; padding:0 6px 0 16px; min-width:0}
.search input{flex:1; border:0; background:none; padding:10px 0; color:#16274A; min-width:0; outline:none}
.search button{border:0; background:var(--gold); color:var(--gold-ink); border-radius:99px; padding:7px 14px; font-weight:800; cursor:pointer}
.hico{position:relative; border:0; background:none; color:#fff; cursor:pointer; padding:8px; border-radius:10px; display:grid; place-items:center}
.hico svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.hico .b{position:absolute; top:2px; right:0; background:var(--gold); color:var(--gold-ink); font-size:10px; font-weight:900; border-radius:99px; padding:0 5px; min-width:16px; text-align:center}
.hbtn{border:1.5px solid rgba(255,255,255,.4); background:none; color:#fff; font-weight:700; border-radius:10px; padding:8px 12px; cursor:pointer; white-space:nowrap}
.catmenu{position:absolute; top:58px; left:0; width:260px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:8px; box-shadow:0 20px 40px rgba(8,17,39,.25); display:grid; gap:2px}
.catmenu button{text-align:left; border:0; background:none; padding:10px 12px; border-radius:10px; font-weight:700; cursor:pointer; display:flex; justify-content:space-between}
.catmenu button:hover{background:var(--surface-2)}
.catmenu small{color:var(--muted); font-weight:600}
.msearch{display:none}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:12px 18px; font-weight:800; font-size:.92rem; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn-gold{background:var(--gold); color:var(--gold-ink); box-shadow:0 5px 0 -1px var(--gold-d)}
.btn-dark{background:var(--accent); color:var(--accent-ink)}
.btn-line{background:var(--surface); color:var(--ink); border:1.5px solid var(--ink)}
.btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.btn-sm{padding:8px 12px; font-size:.82rem; border-radius:10px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.full{width:100%}
.chip{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:7px 14px; font-weight:700; font-size:.84rem; cursor:pointer; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.linkbtn{border:0; background:none; padding:0; color:var(--link); font-weight:700; cursor:pointer; text-decoration:underline; font-size:.86rem}

/* hero */
.hero{background:var(--navy); color:#fff; position:relative; overflow:hidden}
.hero .wrap{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:30px; align-items:center; padding-block:48px}
.hero h1{font-size:clamp(1.9rem,4vw,3rem); font-weight:900}
.hero h1 em{font-style:normal; color:var(--gold)}
.hero p{color:#C9D6EC; margin-top:12px; font-size:1.05rem; max-width:46ch}
.hero .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px}
.hero img{width:100%; max-width:480px; justify-self:end; filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
.facts{display:flex; gap:22px; flex-wrap:wrap; margin-top:24px; font-size:.84rem; color:#C9D6EC}
.facts b{display:block; color:#fff; font-size:1.2rem}

/* sections */
.sec{padding-block:30px 6px; display:grid; gap:16px}
.sec-h{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.sec-h h2{font-size:1.35rem; font-weight:900}
.sec-h p{color:var(--muted); font-size:.9rem; margin-top:4px}
.grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:grid; grid-template-rows:auto 1fr; cursor:pointer; text-align:left; padding:0; transition:transform .2s, box-shadow .2s; position:relative}
.card:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(15,30,61,.12)}
.card img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block}
.card .b{padding:12px 14px 14px; display:grid; gap:5px; align-content:start}
.card b{font-size:.95rem; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .by{font-size:.78rem; color:var(--muted)}
.stars{display:flex; align-items:center; gap:5px; font-size:.8rem; font-weight:800; color:var(--star)}
.stars small{color:var(--muted); font-weight:600}
.price{font-weight:900; font-size:1.02rem}
.badge{position:absolute; top:10px; left:10px; font-size:.7rem; font-weight:900; padding:3px 9px; border-radius:7px; background:var(--gold); color:var(--gold-ink)}
.badge.new{background:var(--good); color:#fff}
.fav{position:absolute; top:8px; right:8px; width:34px; height:34px; border-radius:50%; border:0; background:rgba(255,255,255,.92); display:grid; place-items:center; cursor:pointer; color:#16274A}
.fav svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2}
.fav[aria-pressed="true"]{color:#D9487E}
.fav[aria-pressed="true"] svg{fill:currentColor}
.tiles{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px}
.tile{border:0; border-radius:16px; padding:16px; min-height:110px; color:#fff; text-align:left; cursor:pointer; display:grid; align-content:space-between; font-weight:800; position:relative; overflow:hidden}
.tile small{font-weight:600; opacity:.85}
.tile::after{content:""; position:absolute; right:-24px; bottom:-24px; width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,.14)}
.soon{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.soon-i{background:var(--surface); border:1px dashed var(--line); border-radius:16px; padding:14px; display:grid; gap:8px}
.soon-i b{font-size:.92rem}
.soon-i small{color:var(--muted); font-size:.78rem}
.band{background:var(--gold-soft); border-radius:20px; padding:22px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-top:28px}
.band b{display:block; font-size:.95rem}
.band span{font-size:.84rem; color:var(--muted)}

/* listing */
.listing{display:grid; grid-template-columns:230px minmax(0,1fr); gap:26px; align-items:start; padding-block:26px}
.filters{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; display:grid; gap:10px; position:sticky; top:84px}
.filters h3{font-size:.9rem}
.filters label{display:flex; align-items:center; gap:8px; font-size:.88rem; font-weight:600; cursor:pointer}
.filters input{width:17px; height:17px; accent-color:var(--navy)}
.list-h{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.list-h h1{font-size:1.5rem; font-weight:900}
select.sel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-weight:700}
.mchips{display:none}
.empty{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:30px; text-align:center; color:var(--muted)}

/* product */
.pbar{background:var(--navy); color:#fff}
.pbar .wrap{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:30px; padding-block:30px}
.crumbs{font-size:.8rem; color:#AFC2E3; display:flex; gap:6px; flex-wrap:wrap}
.crumbs button{border:0; background:none; color:#AFC2E3; cursor:pointer; padding:0; font-weight:700}
.pbar h1{font-size:clamp(1.6rem,3vw,2.2rem); font-weight:900; margin-top:10px}
.pbar p{color:#C9D6EC; margin-top:10px; max-width:60ch}
.pbar .meta{display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; font-size:.84rem; color:#C9D6EC; align-items:center}
.pbar .stars{color:var(--gold)}
.pmain{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:30px; align-items:start; padding-block:24px}
.pcol{display:grid; gap:16px; min-width:0}
.box{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:grid; gap:12px}
.box h2{font-size:1.1rem; font-weight:900}
.learn{margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.learn li{display:grid; grid-template-columns:22px 1fr; gap:8px; font-size:.9rem}
.learn li::before{content:"✓"; width:22px; height:22px; border-radius:50%; background:var(--good-soft); color:var(--good); display:grid; place-items:center; font-weight:900; font-size:.75rem}
.toc{display:grid; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.toc div{display:flex; justify-content:space-between; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); font-size:.88rem}
.toc div:last-child{border-bottom:0}
.toc span{color:var(--muted); font-size:.8rem; white-space:nowrap}
.author{display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:center}
.author .av{width:64px; height:64px; border-radius:50%; background:var(--sky); color:#fff; display:grid; place-items:center; font-weight:900; font-size:20px}
.rev{display:grid; gap:4px; border-top:1px solid var(--line); padding-top:12px}
.rev:first-of-type{border-top:0; padding-top:0}
.rev small{color:var(--muted)}
.ex{font-size:.72rem; font-weight:800; background:var(--warn-soft); border-radius:99px; padding:2px 8px; width:max-content}
.side{position:sticky; top:84px; margin-top:-200px; display:grid; gap:12px}
.buy{background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 20px 40px rgba(15,30,61,.15)}
.buy img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block}
.buy .b{padding:16px; display:grid; gap:10px}
.buy .price{font-size:1.9rem}
.buy ul{margin:0; padding-left:18px; font-size:.84rem; display:grid; gap:4px}
.mbuy{display:none}

/* cart & checkout */
.two-col{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:26px; align-items:start; padding-block:26px}
.citem{display:grid; grid-template-columns:120px minmax(0,1fr) auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px}
.citem img{width:120px; aspect-ratio:16/9; object-fit:cover; border-radius:10px}
.citem b{font-size:.92rem}
.citem .act{display:flex; gap:12px; margin-top:6px}
.sum{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:grid; gap:10px; position:sticky; top:84px}
.sum .line{display:flex; justify-content:space-between; gap:10px; font-size:.88rem; color:var(--muted)}
.sum .tot{display:flex; justify-content:space-between; font-weight:900; font-size:1.3rem; border-top:1px solid var(--line); padding-top:10px}
.sum .mini{display:grid; grid-template-columns:56px 1fr; gap:10px; align-items:center; font-size:.8rem; font-weight:700}
.sum .mini img{width:56px; aspect-ratio:16/9; object-fit:cover; border-radius:6px}
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:0 0 14px; padding:0}
.steps li{list-style:none; font-size:.74rem; font-weight:800; color:var(--muted); padding-top:10px; position:relative}
.steps li::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; border-radius:99px; background:var(--line)}
.steps li.on{color:var(--ink)}
.steps li.on::before{background:var(--gold)}
.field{display:grid; gap:6px}
.field label{font-size:.8rem; font-weight:700; color:var(--muted)}
.field input{width:100%; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:12px 13px; color:var(--ink)}
.field input:focus{outline:none; border-color:var(--sky)}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad); font-size:.78rem; font-weight:700}
.two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.check{display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:start; font-size:.84rem; background:var(--surface-2); border-radius:12px; padding:12px; cursor:pointer}
.check input{width:20px; height:20px; accent-color:var(--navy); margin:0}
.pay{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.pay button{display:grid; gap:2px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer}
.pay button small{color:var(--muted); font-size:.76rem}
.pay button[aria-checked="true"]{border-color:var(--sky); box-shadow:0 0 0 3px rgba(91,143,214,.2)}
.pix{display:grid; justify-items:center; gap:10px; text-align:center}
.qr{background:#fff; border-radius:16px; padding:12px; border:1px solid var(--line)}
.qr svg{display:block; width:180px; height:180px}
.code{display:flex; gap:8px; width:100%; background:var(--surface-2); border-radius:12px; padding:8px 8px 8px 12px; align-items:center}
.code code{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.78rem}
.wait{display:flex; align-items:center; gap:8px; font-size:.84rem; color:var(--muted); font-weight:600}
.spin{width:14px; height:14px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--sky); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{background:var(--bad-soft); color:var(--bad); border-radius:12px; padding:10px 12px; font-size:.84rem; font-weight:700}
.hint{background:var(--warn-soft); border-radius:12px; padding:8px 12px; font-size:.76rem}
.okc{width:64px; height:64px; border-radius:50%; background:var(--good-soft); color:var(--good); display:grid; place-items:center; font-size:30px; font-weight:900; animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.6); opacity:0}to{transform:none; opacity:1}}
.narrow{max-width:620px; margin:0 auto; padding-block:30px; display:grid; gap:14px}
.center{display:grid; justify-items:center; text-align:center; gap:10px}

/* library & reader */
.lib{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px}
.lcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:grid}
.lcard img{width:100%; aspect-ratio:16/9; object-fit:cover}
.lcard .b{padding:12px 14px 14px; display:grid; gap:8px}
.prog{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--good); border-radius:99px}
.tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:4px; width:max-content; max-width:100%; overflow-x:auto}
.tabs button{border:0; background:none; padding:8px 14px; border-radius:10px; font-weight:700; font-size:.86rem; cursor:pointer; color:var(--muted); white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink)}
.reader{display:grid; grid-template-columns:260px minmax(0,1fr); gap:26px; padding-block:20px; align-items:start}
.chap{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px; display:grid; gap:2px; position:sticky; top:84px}
.chap button{text-align:left; border:0; background:none; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:600; font-size:.86rem; display:grid; grid-template-columns:22px 1fr; gap:8px}
.chap button[aria-current="true"]{background:var(--surface-2); font-weight:800}
.chap button span{font-weight:900; color:var(--muted)}
.page{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(18px,4vw,44px); display:grid; gap:16px; max-width:760px}
.page h1{font-size:1.7rem; font-weight:900}
.page p{font-family:var(--read); font-size:1.04rem; line-height:1.85; max-width:65ch}
.video{aspect-ratio:16/9; border-radius:14px; background:#0F1E3D center/cover; position:relative; display:grid; place-items:center; color:#fff; overflow:hidden; border:0; cursor:pointer; padding:0}
.video::before{content:""; position:absolute; inset:0; background:rgba(15,30,61,.55)}
.video span{position:relative; display:grid; justify-items:center; gap:8px; font-weight:800}
.video i{width:58px; height:58px; border-radius:50%; background:var(--gold); color:var(--gold-ink); display:grid; place-items:center; font-style:normal; font-size:22px}
.sample{background:var(--gold-soft); border-radius:12px; padding:12px 14px; font-size:.86rem; display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap}

.demo{background:var(--gold-soft); text-align:center; font-size:.76rem; font-weight:700; padding:6px 16px}
footer{background:var(--navy-2); color:#AFC2E3; margin-top:40px; padding-block:30px}
footer .wrap{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; font-size:.84rem}
footer img{height:22px; width:auto}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:700; font-size:.86rem; z-index:80; box-shadow:0 10px 30px rgba(8,17,39,.3)}
.scrim{position:fixed; inset:0; background:rgba(8,17,39,.55); z-index:70; display:grid; place-items:center; padding:20px}
.modal{background:var(--surface); border-radius:20px; padding:22px; width:min(420px,100%); display:grid; gap:12px}

@media (max-width: 1080px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} .band{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 900px){
  .catbtn,.hdr .search{display:none}
  .msearch{display:block; background:var(--navy-2); padding-block:0 12px}
  .msearch .search{display:flex}
  .hero .wrap{grid-template-columns:minmax(0,1fr); padding-block:30px}
  .hero img{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  .listing,.reader{grid-template-columns:minmax(0,1fr)}
  .filters{display:none}
  .mchips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px}
  .pbar .wrap,.pmain,.two-col{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mbuy{display:block; position:sticky; bottom:0; z-index:30; padding-block:10px calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, var(--bg) 25%)}
  .mbuy .row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 10px 10px 14px; box-shadow:0 10px 30px rgba(15,30,61,.15)}
  .mbuy .price{flex:1}
  .sum{position:static}
  .lib{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chap{position:static; grid-auto-flow:column; grid-auto-columns:max-content; overflow-x:auto}
  .soon{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 560px){
  .hdr .wrap{gap:6px}
  .logo span{display:none}
  .hbtn{padding:7px 9px; font-size:.82rem}
  .card .b{padding:10px 11px 12px}
  .card b{font-size:.86rem}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .learn{grid-template-columns:minmax(0,1fr)}
  .citem{grid-template-columns:90px minmax(0,1fr)}
  .citem img{width:90px}
  .citem .p{grid-column:2}
  .two,.pay{grid-template-columns:minmax(0,1fr)}
  .lib{grid-template-columns:minmax(0,1fr)}
  .band{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

function QR({ text }){

/* ===== Busca / categoria ===== */
function Busca({ s }){
  const v = s.view;
  const [cats, setCats] = useState(v.cat ? [v.cat] : []);
  const [sort, setSort] = useState(v.sort || "relevancia");
  useEffect(() => { setCats(v.cat ? [v.cat] : []); setSort(v.sort || "relevancia"); }, [v.cat, v.q, v.sort]);
  const q = (v.q || "").trim().toLowerCase();
  let list = EB.filter(e => (!cats.length || cats.includes(e.c)) && (!q || (e.t + " " + e.d + " " + catName(e.c)).toLowerCase().includes(q)));
  list = list.slice().sort(sort === "vendidos" ? (a, b) => b.sold - a.sold : sort === "recentes" ? (a, b) => a.added - b.added : sort === "avaliacao" ? (a, b) => b.rate - a.rate : sort === "az" ? (a, b) => a.t.localeCompare(b.t) : (a, b) => b.sold - a.sold);
  const toggle = id => setCats(c => c.includes(id) ? c.filter(x => x !== id) : [...c, id]);
  const title = q ? `Resultados para "${v.q}"` : cats.length === 1 ? catName(cats[0]) : "Todos os e-books";
  return html`<div className="wrap listing">
    <aside className="filters"><h3>Categorias</h3>${CATS.map(c => html`<label key=${c.id}><input type="checkbox" checked=${cats.includes(c.id)} onChange=${() => toggle(c.id)} />${c.t} <span className="muted">(${EB.filter(e => e.c === c.id).length})</span></label>`)}
      ${cats.length ? html`<button className="linkbtn" style=${{ justifySelf:"start" }} onClick=${() => setCats([])}>Limpar filtros</button>` : null}</aside>
    <div style=${{ minWidth:0 }}>
      <div className="list-h"><div><h1>${title}</h1><p className="muted">${list.length} ${list.length === 1 ? "e-book" : "e-books"}</p></div>
        <label className="muted" style=${{ fontSize:".84rem", fontWeight:700, display:"flex", gap:"8px", alignItems:"center" }}>Ordenar por <select className="sel" value=${sort} onChange=${e => setSort(e.target.value)}><option value="relevancia">Mais relevantes</option><option value="vendidos">Mais vendidos</option><option value="avaliacao">Melhor avaliados</option><option value="recentes">Mais recentes</option><option value="az">A a Z</option></select></label></div>
      <div className="mchips"><button className="chip" aria-pressed=${!cats.length} onClick=${() => setCats([])}>Todas</button>${CATS.map(c => html`<button key=${c.id} className="chip" aria-pressed=${cats.includes(c.id)} onClick=${() => toggle(c.id)}>${c.t}</button>`)}</div>
      ${list.length ? html`<div className="grid" style=${{ gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))" }}>${list.map(e => html`<${Card} key=${e.id} e=${e} s=${s} />`)}</div>` : html`<div className="empty"><b>Nenhum e-book encontrado.</b><p style=${{ marginTop:"6px" }}>Tente outra palavra ou <button className="linkbtn" onClick=${() => s.go({ v:"busca" })}>veja todos os e-books</button>.</p></div>`}
    </div>
  </div>`;
}

/* ===== Checkout ===== */
const digits = v => v.replace(/\D/g, "");
const phoneMask = v => { const d = digits(v).slice(0, 11); if (d.length <= 2) return d; if (d.length <= 7) return "(" + d.slice(0, 2) + ") " + d.slice(2); return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7); };
const cpfMask = v => digits(v).slice(0, 11).replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
const cardMask = v => digits(v).slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
const expMask = v => { const d = digits(v).slice(0, 4); return d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d; };
const PIX = "00020126580014BR.GOV.BCB.PIX0136braduca-loja-exemplo-0000000000005204000053039865802BR5913BRADUCA LOJA6009FORTALEZA62070503***6304ABCD";
const Steps = ({ n }) => html`<ol className="steps" aria-label="Etapas">${["Seus dados","Pagamento","Pronto"].map((t, i) => html`<li key=${t} className=${i <= n ? "on" : ""} aria-current=${i === n ? "step" : undefined}>${t}</li>`)}</ol>`;
function Summary({ items }){
  return html`<div className="sum"><b>Resumo do pedido</b>
    ${items.map(id => html`<div className="mini" key=${id}><img src=${cover(id)} alt="" /><span>${byId[id].t}</span></div>`)}
    <div className="line"><span>${items.length} ${items.length === 1 ? "e-book" : "e-books"}</span><span className="num">${brl(PRICE * items.length)}</span></div>
    <div className="tot"><span>Total</span><span className="num">${brl(PRICE * items.length)}</span></div>
    <p className="muted" style=${{ fontSize:".78rem" }}>🔒 Compra segura · Garantia de 7 dias · Nota fiscal no e-mail</p>
  </div>`;
}
function Checkout({ s }){
  const items = s.view.items && s.view.items.length ? s.view.items : s.cart;
  const [step, setStep] = useState(0);
  const [d, setD] = useState({ name:s.user ? s.user.name : "", phone:s.user ? s.user.phone : "", email:s.user ? s.user.email : "", cpf:"", consent:false });
  const [touched, setTouched] = useState(false);
  const [method, setMethod] = useState("pix");
  const [pixOn, setPixOn] = useState(false);
  const [card, setCard] = useState({ num:"", exp:"", cvv:"", holder:"" });
  const [st, setSt] = useState("idle");
  const total = PRICE * items.length;
  const errs = { name:d.name.trim().split(/\s+/).length < 2 ? "Digite nome e sobrenome." : "", phone:digits(d.phone).length < 10 ? "Digite o WhatsApp com DDD." : "", email:!/^\S+@\S+\.\S+$/.test(d.email) ? "Digite um e-mail válido." : "", cpf:d.cpf && digits(d.cpf).length !== 11 ? "O CPF tem 11 números." : "" };
  const ok = !Object.values(errs).some(Boolean);
  const set = k => ev => setD({ ...d, [k]:k === "phone" ? phoneMask(ev.target.value) : k === "cpf" ? cpfMask(ev.target.value) : ev.target.value });
  const fld = (k, label, type, mode, ac, ph) => html`<div className="field"><label htmlFor=${"k" + k}>${label}</label><input id=${"k" + k} type=${type || "text"} inputMode=${mode} autoComplete=${ac} placeholder=${ph} value=${d[k]} onInput=${set(k)} aria-invalid=${touched && !!errs[k]} />${touched && errs[k] ? html`<span className="err">${errs[k]}</span>` : null}</div>`;
  const finish = m => { s.purchase(items, d, m); setStep(2); window.scrollTo(0, 0); };
  const cardOk = digits(card.num).length === 16 && /^\d{2}\/\d{2}$/.test(card.exp) && digits(card.cvv).length >= 3 && card.holder.trim().length > 3;
  useEffect(() => { if (st !== "checking") return; const t = setTimeout(() => finish("pix"), 1500); return () => clearTimeout(t); }, [st]);
  if (!items.length && step < 2) return html`<div className="wrap narrow"><div className="empty">Nenhum e-book para comprar. <button className="linkbtn" onClick=${() => s.go({ v:"busca" })}>Ver e-books</button></div></div>`;
  if (step === 2) return html`<div className="wrap narrow">
    <${Steps} n=${2} />
    <div className="box center"><span className="okc">✓</span><h1 style=${{ fontSize:"1.5rem" }}>Compra confirmada, ${d.name.split(" ")[0]}!</h1><p className="muted" style=${{ maxWidth:"44ch" }}>${items.length === 1 ? "Seu e-book já está" : "Seus e-books já estão"} na sua biblioteca. Também enviamos o acesso para <b>${d.email}</b> e para o seu WhatsApp.</p></div>
    <div className="box">${items.map(id => html`<div className="mini" key=${id} style=${{ display:"grid", gridTemplateColumns:"72px 1fr auto", gap:"12px", alignItems:"center" }}><img src=${cover(id)} alt="" style=${{ width:"72px", aspectRatio:"16/9", objectFit:"cover", borderRadius:"8px" }} /><b style=${{ fontSize:".9rem" }}>${byId[id].t}</b><button className="btn btn-gold btn-sm" onClick=${() => s.go({ v:"leitor", id })}>Ler agora</button></div>`)}</div>
    <p className="muted" style=${{ fontSize:".82rem", textAlign:"center" }}>${s.user && s.user.fresh ? "Criamos sua conta com este e-mail. Para entrar de novo, use o código que enviamos por e-mail." : ""} A nota fiscal chega no seu e-mail. Reembolso em até 7 dias.</p>
    <button className="btn btn-ghost" onClick=${() => s.go({ v:"conta", tab:"biblioteca" })}>Ir para Meus e-books</button>
  </div>`;
  return html`<div className="wrap two-col">
    <div style=${{ minWidth:0, display:"grid", gap:"14px" }}>
      <button className="linkbtn" style=${{ justifySelf:"start", textDecoration:"none" }} onClick=${() => step ? setStep(0) : s.go({ v:"carrinho" })}>← ${step ? "Voltar para seus dados" : "Voltar ao carrinho"}</button>
      <${Steps} n=${step} />
      ${step === 0 ? html`<div className="box">
        <h2>Para onde enviamos seus e-books?</h2>
        ${!s.user ? html`<p className="muted" style=${{ fontSize:".84rem" }}>Já comprou antes? <button className="linkbtn" onClick=${() => s.go({ v:"entrar", back:{ v:"checkout", items } })}>Entre na sua conta</button>. Se não, criamos uma com este e-mail.</p>` : null}
        ${fld("name", "Nome completo", "text", undefined, "name")}
        <div className="two">${fld("phone", "WhatsApp", "tel", "tel", "tel", "(85) 99999-9999")}${fld("email", "E-mail", "email", undefined, "email")}</div>
        ${fld("cpf", "CPF na nota (opcional)", "text", "numeric", undefined, "000.000.000-00")}
        <label className="check"><input type="checkbox" checked=${d.consent} onChange=${ev => setD({ ...d, consent:ev.target.checked })} /><span>Aceito receber mensagens no WhatsApp e por e-mail sobre minha compra e novidades da Braduca.</span></label>
        <button className="btn btn-gold full" onClick=${() => { setTouched(true); if (ok){ setStep(1); window.scrollTo(0, 0); } }}>Ir para o pagamento</button>
      </div>` : html`<${F}>
        <div className="pay" role="radiogroup" aria-label="Forma de pagamento">
          <button role="radio" aria-checked=${method === "pix"} onClick=${() => setMethod("pix")}><b>Pix</b><small>Aprovação na hora</small></button>
          <button role="radio" aria-checked=${method === "cartao"} onClick=${() => setMethod("cartao")}><b>Cartão de crédito</b><small>À vista</small></button>
        </div>
        ${method === "pix" ? html`<div className="box">${!pixOn ? html`<${F}><h2>Pagar com Pix</h2><p className="muted" style=${{ fontSize:".88rem" }}>Geramos um código para você pagar no app do banco. Os e-books chegam assim que o pagamento cair.</p><button className="btn btn-gold full" onClick=${() => setPixOn(true)}>Gerar Pix de ${brl(total)}</button></${F}>` : html`<div className="pix">
          <h2>Pague ${brl(total)} com Pix</h2><${QR} text=${PIX} />
          <div className="code"><code>${PIX}</code><button className="btn btn-dark btn-sm" onClick=${() => copy(PIX, s.toast)}>Copiar código</button></div>
          <p className="wait"><span className="spin"></span>${st === "checking" ? "Confirmando o pagamento…" : "Esperando o pagamento. Esta tela atualiza sozinha."}</p>
          <div className="hint">Protótipo: toque abaixo para simular o pagamento.</div>
          <button className="btn btn-ghost btn-sm" disabled=${st === "checking"} onClick=${() => setSt("checking")}>Simular pagamento do Pix</button>
        </div>`}</div>` : html`<div className="box">
          <h2>Dados do cartão</h2>
          ${st === "declined" ? html`<div className="alert" role="alert">O banco recusou o pagamento. Confira os dados, use outro cartão ou pague com Pix.</div>` : null}
          <div className="field"><label htmlFor="cn">Número do cartão</label><input id="cn" inputMode="numeric" autoComplete="cc-number" placeholder="0000 0000 0000 0000" value=${card.num} onInput=${ev => setCard({ ...card, num:cardMask(ev.target.value) })} /></div>
          <div className="two"><div className="field"><label htmlFor="ce">Validade</label><input id="ce" inputMode="numeric" autoComplete="cc-exp" placeholder="MM/AA" value=${card.exp} onInput=${ev => setCard({ ...card, exp:expMask(ev.target.value) })} /></div><div className="field"><label htmlFor="cv">Código de segurança</label><input id="cv" inputMode="numeric" autoComplete="cc-csc" placeholder="CVV" value=${card.cvv} onInput=${ev => setCard({ ...card, cvv:digits(ev.target.value).slice(0, 4) })} /></div></div>
          <div className="field"><label htmlFor="chn">Nome impresso no cartão</label><input id="chn" autoComplete="cc-name" value=${card.holder} onInput=${ev => setCard({ ...card, holder:ev.target.value.toUpperCase() })} /></div>
          <div className="hint">Protótipo: não digite um cartão real. Um número terminado em 0000 simula recusa.</div>
          <button className="btn btn-gold full" disabled=${!cardOk || st === "processing"} onClick=${() => { setSt("processing"); setTimeout(() => digits(card.num).endsWith("0000") ? setSt("declined") : finish("cartao"), 1300); }}>${st === "processing" ? "Processando…" : "Pagar " + brl(total)}</button>
        </div>`}
      </${F}>`}
    </div>
    <${Summary} items=${items} />
  </div>`;
}

/* ===== Entrar ===== */
function Entrar({ s }){
  const [email, setEmail] = useState(""), [sent, setSent] = useState(false), [code, setCode] = useState(""), [err, setErr] = useState("");
  return html`<div className="wrap narrow"><div className="box">
    <h1 style=${{ fontSize:"1.5rem" }}>Entrar na Braduca</h1>
    ${!sent ? html`<${F}>
      <p className="muted">Sem senha: enviamos um código para o seu e-mail.</p>
      <div className="field"><label htmlFor="le">E-mail</label><input id="le" type="email" autoComplete="email" value=${email} onInput=${e => setEmail(e.target.value)} /></div>
      ${err ? html`<span className="err">${err}</span>` : null}
      <button className="btn btn-gold full" onClick=${() => /^\S+@\S+\.\S+$/.test(email) ? (setSent(true), setErr("")) : setErr("Digite um e-mail válido.")}>Enviar código</button>
    </${F}>` : html`<${F}>
      <p className="muted">Enviamos um código de 6 números para <b>${email}</b>.</p>
      <div className="field"><label htmlFor="lc">Código</label><input id="lc" inputMode="numeric" autoComplete="one-time-code" value=${code} onInput=${e => setCode(digits(e.target.value).slice(0, 6))} /></div>
      <div className="hint">Protótipo: qualquer código de 6 números funciona.</div>
      <button className="btn btn-gold full" disabled=${code.length !== 6} onClick=${() => { s.login({ name:"Maria Souza", email, phone:"(85) 99812-3344" }); s.toast("Você entrou"); s.go(s.view.back || { v:"conta", tab:"biblioteca" }); }}>Entrar</button>
      <button className="linkbtn" onClick=${() => { setSent(false); setCode(""); }}>Usar outro e-mail</button>
    </${F}>`}
  </div></div>`;
}

/* ===== Conta: biblioteca e favoritos ===== */
function Conta({ s }){
  const tab = s.view.tab || "biblioteca";
  if (!s.user && tab === "biblioteca") return html`<div className="wrap narrow"><div className="box center"><h1 style=${{ fontSize:"1.4rem" }}>Seus e-books ficam aqui</h1><p className="muted">Entre para ver os e-books que você comprou.</p><button className="btn btn-gold" onClick=${() => s.go({ v:"entrar" })}>Entrar</button></div></div>`;
  return html`<div className="wrap" style=${{ paddingBlock:"26px", display:"grid", gap:"16px" }}>
    <div className="list-h" style=${{ margin:0 }}><h1>${s.user ? "Olá, " + s.user.name.split(" ")[0] : "Favoritos"}</h1>${s.user ? html`<button className="linkbtn" onClick=${() => { s.logout(); s.go({ v:"home" }); }}>Sair</button>` : null}</div>
    <div className="tabs" role="tablist">
      <button role="tab" aria-selected=${tab === "biblioteca"} onClick=${() => s.go({ v:"conta", tab:"biblioteca" })}>Meus e-books · ${s.owned.length}</button>
      <button role="tab" aria-selected=${tab === "favoritos"} onClick=${() => s.go({ v:"conta", tab:"favoritos" })}>Favoritos · ${s.favs.length}</button>
      ${s.user ? html`<button role="tab" aria-selected=${tab === "pedidos"} onClick=${() => s.go({ v:"conta", tab:"pedidos" })}>Pedidos · ${s.orders.length}</button>` : null}
    </div>
    ${tab === "biblioteca" ? (s.owned.length ? html`<div className="lib">${s.owned.map(id => { const p = s.progress[id] || 0; return html`<div className="lcard" key=${id}><img src=${cover(id)} alt="" /><div className="b"><b>${byId[id].t}</b><div className="prog"><i style=${{ width:p + "%" }}></i></div><small className="muted">${p ? p + "% lido" : "Ainda não começou"}</small><div style=${{ display:"flex", gap:"8px", flexWrap:"wrap" }}><button className="btn btn-gold btn-sm" onClick=${() => s.go({ v:"leitor", id })}>${p ? "Continuar" : "Começar a ler"}</button><button className="btn btn-ghost btn-sm" onClick=${() => s.go({ v:"leitor", id, video:true })}>Vídeos do autor</button></div></div></div>`; })}</div>` : html`<div className="empty">Você ainda não tem e-books. <button className="linkbtn" onClick=${() => s.go({ v:"busca" })}>Ver a loja</button></div>`)
    : tab === "favoritos" ? (s.favs.length ? html`<div className="grid">${s.favs.map(id => html`<${Card} key=${id} e=${byId[id]} s=${s} />`)}</div>` : html`<div className="empty">Toque no coração de um e-book para guardar aqui.</div>`)
    : html`<div className="box">${s.orders.length ? s.orders.slice().reverse().map(o => html`<div key=${o.id} className="rev"><b>Pedido ${o.id} · ${o.date}</b><small>${o.items.map(id => byId[id].t).join(", ")}</small><small>${brl(o.total)} · ${o.method === "pix" ? "Pix" : "Cartão"} · Pago · Nota fiscal enviada ao e-mail</small><button className="linkbtn" style=${{ justifySelf:"start" }} onClick=${() => s.toast("Pedido de reembolso aberto (protótipo)")}>Pedir reembolso</button></div>`) : html`<p className="muted">Nenhum pedido ainda.</p>`}</div>`}
  </div>`;
}

/* ===== Leitor ===== */
function Leitor({ s }){
  const e = byId[s.view.id];
  const [ch, setCh] = useState(0);
  const [vid, setVid] = useState(!!s.view.video);
  useEffect(() => { s.setProg(e.id, Math.max(s.progress[e.id] || 0, Math.round((ch + 1) / e.learn.length * 100))); }, [ch]);
  if (!s.owned.includes(e.id)) return html`<div className="wrap narrow"><div className="box center"><h1 style=${{ fontSize:"1.3rem" }}>Este e-book ainda não é seu</h1><button className="btn btn-gold" onClick=${() => s.go({ v:"ebook", id:e.id })}>Ver o e-book</button></div></div>`;
  return html`<div className="wrap">
    <div className="list-h" style=${{ paddingTop:"20px", margin:0 }}><div><button className="linkbtn" style=${{ textDecoration:"none" }} onClick=${() => s.go({ v:"conta", tab:"biblioteca" })}>← Meus e-books</button><h1 style=${{ fontSize:"1.2rem", marginTop:"6px" }}>${e.t}</h1></div><span className="muted" style=${{ fontSize:".84rem", fontWeight:700 }}>Capítulo ${ch + 1} de ${e.learn.length}</span></div>
    <div className="reader">
      <nav className="chap" aria-label="Capítulos">${e.learn.map((l, i) => html`<button key=${i} aria-current=${i === ch} onClick=${() => { setCh(i); setVid(false); }}><span>${i + 1}</span>${l}</button>`)}</nav>
      <article className="page">
        <h1>${e.learn[ch]}</h1>
        <${Para} e=${e} i=${ch} />
        <button className="video" style=${{ backgroundImage:`url(${cover(e.id)})` }} onClick=${() => setVid(true)} aria-label="Assistir vídeo do autor"><span><i>▶</i>${vid ? "O player de vídeo entra aqui na versão final" : "Vídeo do autor sobre este capítulo"}</span></button>
        <div style=${{ display:"flex", justifyContent:"space-between", gap:"10px", flexWrap:"wrap" }}>
          <button className="btn btn-ghost" disabled=${ch === 0} onClick=${() => { setCh(ch - 1); window.scrollTo(0, 0); }}>← Anterior</button>
          ${ch < e.learn.length - 1 ? html`<button className="btn btn-gold" onClick=${() => { setCh(ch + 1); window.scrollTo(0, 0); }}>Próximo capítulo →</button>` : html`<button className="btn btn-gold" onClick=${() => { s.toast("E-book concluído!"); s.go({ v:"conta", tab:"biblioteca" }); }}>Concluir e-book</button>`}
        </div>
      </article>
    </div>
  </div>`;
}

/* ===== App ===== */
function App(){
  const [view, setView] = useState({ v:"home" });
  const [cart, setCart] = useState([]);
  const [favs, setFavs] = useState(["adest"]);
  const [user, setUser] = useState(null);
  const [owned, setOwned] = useState([]);
  const [orders, setOrders] = useState([]);
  const [progress, setProgress] = useState({});
  const [msg, setMsg] = useState("");
  const tRef = useRef();
  const s = {
    view, cart, favs, user, owned, orders, progress,
    go:v => { setView(v); window.scrollTo(0, 0); },
    toast:m => { setMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setMsg(""), 2200); },
    toggleFav:id => setFavs(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]),
    addCart:id => setCart(c => c.includes(id) ? c : [...c, id]),
    removeCart:id => setCart(c => c.filter(x => x !== id)),
    login:u => { setUser(u); setOwned(o => o.length ? o : ["info"]); setOrders(o => o.length ? o : [{ id:"#10482", date:"12/09", items:["info"], total:PRICE, method:"pix" }]); setProgress(p => ({ info:50, ...p })); },
    logout:() => { setUser(null); setOwned([]); setOrders([]); },
    purchase:(items, d, method) => {
      if (!user) setUser({ name:d.name, email:d.email, phone:d.phone, fresh:true });
      setOwned(o => [...o, ...items.filter(i => !o.includes(i))]);
      setCart(c => c.filter(i => !items.includes(i)));
      setOrders(o => [...o, { id:"#" + (10483 + o.length), date:"25/10", items, total:PRICE * items.length, method }]);
    },
    setProg:(id, p) => setProgress(x => ({ ...x, [id]:p }))
  };
  const V = { home:Home, busca:Busca, ebook:Ebook, carrinho:Carrinho, checkout:Checkout, entrar:Entrar, conta:Conta, leitor:Leitor }[view.v];
  const k = view.v + (view.id || "") + (view.q || "") + (view.cat || "") + (view.tab || "");
  return html`<${F}>
    <${Header} s=${s} key=${"h" + (view.q || "")} />
    <main><${V} s=${s} key=${k} /></main>
    <footer><div className="wrap"><img src=${IMG.logo_w} alt="Braduca" /><span>E-books práticos com vídeos dos autores. Vendido e entregue pela Braduca.</span><span>Pagamento seguro · Garantia de 7 dias</span></div></footer>
    ${msg ? html`<div className="toast" role="status">${msg}</div>` : null}
  </${F}>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>

</body>
</html>
