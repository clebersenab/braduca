<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Braduca Creators</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: navy sidebar (desktop) + content column of sections; phone: top bar + bottom tabs with "Mais" sheet. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#EEF3FA; --ink:#16274A; --muted:#5A6882; --line:#DCE4F0;
  --accent:#3F77C8; --accent-ink:#FFFFFF; --gold:#F4C63F; --gold-ink:#16274A; --gold-soft:#FCEFC4;
  --side:#0F1E3D; --side-ink:#C9D6EC; --side-active:#1D3363;
  --chart:#4A82D2; --chart-soft:#C7D8F1; --grid:#E3E9F3;
  --c-rev:#D99A0B; --c-sales:#3F77C8; --c-visits:#8A5CD1; --c-rev-ink:#16274A;
  --good:#1E8B5A; --good-soft:#DDF3E8; --warn:#A86A00; --warn-soft:#FBEFD2; --bad:#B3261E; --bad-soft:#FBE3E1; --info-soft:#E1ECFA;
  --f:"Montserrat","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1530; --surface:#132346; --surface-2:#1A2D57; --ink:#EAF0FA; --muted:#A3B1C9; --line:#26396A;
    --accent:#7FA9EA; --accent-ink:#0B1530; --gold:#F4C63F; --gold-ink:#16274A; --gold-soft:#3A3318;
    --side:#081127; --side-ink:#B5C4DE; --side-active:#1A2D57;
    --chart:#7FA9EA; --chart-soft:#2B4677; --grid:#22355F;
    --c-rev:#F4C63F; --c-sales:#7FA9EA; --c-visits:#B79AF0; --c-rev-ink:#16274A;
    --good:#5FD39C; --good-soft:#163D2E; --warn:#F1B44C; --warn-soft:#3D3115; --bad:#F2867E; --bad-soft:#44201F; --info-soft:#1D3260;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1530; --surface:#132346; --surface-2:#1A2D57; --ink:#EAF0FA; --muted:#A3B1C9; --line:#26396A;
  --accent:#7FA9EA; --accent-ink:#0B1530; --gold:#F4C63F; --gold-ink:#16274A; --gold-soft:#3A3318;
  --side:#081127; --side-ink:#B5C4DE; --side-active:#1A2D57;
  --chart:#7FA9EA; --chart-soft:#2B4677; --grid:#22355F;
  --c-rev:#F4C63F; --c-sales:#7FA9EA; --c-visits:#B79AF0; --c-rev-ink:#16274A;
  --good:#5FD39C; --good-soft:#163D2E; --warn:#F1B44C; --warn-soft:#3D3115; --bad:#F2867E; --bad-soft:#44201F; --info-soft:#1D3260;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--side)}
h1,h2,h3,h4{margin:0; line-height:1.15; letter-spacing:-.02em; text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh}
.side{background:var(--side); color:var(--side-ink); position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px)); display:flex; flex-direction:column; padding:22px 14px 18px max(14px, env(safe-area-inset-left,0px))}
.side .brand{display:flex; align-items:center; gap:8px; padding:0 8px 22px}
.side .brand img{height:24px; width:auto}
.tag{font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--gold); color:var(--gold-ink)}
.nav{display:grid; gap:2px}
.nav button{display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; color:var(--side-ink); text-align:left; padding:10px 12px; border-radius:12px; font-weight:600; font-size:.92rem; cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.05); color:#fff}
.nav button[aria-current="page"]{background:var(--side-active); color:#fff}
.nav svg{width:19px; height:19px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.nav .badge{margin-left:auto; font-size:11px; font-weight:800; background:var(--gold); color:var(--gold-ink); border-radius:99px; padding:1px 8px}
.side .me{margin-top:auto; display:flex; align-items:center; gap:10px; padding:12px 8px 0; border-top:1px solid rgba(255,255,255,.08)}
.side .me .av{width:36px; height:36px; border-radius:50%; background:#2A4378 center/cover; display:grid; place-items:center; color:#fff; font-weight:800; font-size:13px; flex:none}
.side .me b{display:block; color:#fff; font-size:.88rem}
.side .me small{font-size:.75rem}

.main{min-width:0; padding-block:28px 60px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.main-in{max-width:1120px; margin:0 auto; display:grid; gap:22px}
.demo{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.82rem; font-weight:600; color:var(--muted)}
.demo span{background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:4px 10px}
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.head h1{font-size:clamp(1.5rem,2.6vw,2rem); font-weight:800}
.head p{color:var(--muted); margin-top:6px; max-width:62ch}

/* cards & grids */
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; min-width:0}
.card h3{font-size:1rem; font-weight:800}
.card .sub{color:var(--muted); font-size:.85rem; margin-top:2px}
.ch{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.g2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.g3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.g4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}
.g-21{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:16px}
.kpi small{display:block; color:var(--muted); font-size:.8rem; font-weight:600}
.kpi strong{display:block; font-size:1.55rem; font-weight:800; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums}
.kpi .delta{font-size:.78rem; font-weight:700; margin-top:4px}
.up{color:var(--good)} .down{color:var(--bad)}
.hero-bal{background:var(--side); color:#fff; border:0}
.hero-bal small{color:#AFC2E3}
.hero-bal strong{color:var(--gold)}

/* buttons, chips, inputs */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:10px 16px; font-weight:700; font-size:.88rem; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn-gold{background:var(--gold); color:var(--gold-ink)}
.btn-primary{background:var(--accent); color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.btn-wa{background:#1E8B5A; color:#fff}
.btn-sm{padding:7px 12px; font-size:.8rem; border-radius:10px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:6px 12px; font-weight:700; font-size:.8rem; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:800; padding:3px 9px; border-radius:99px; white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.info{background:var(--info-soft); color:var(--accent)}
.pill.mute{background:var(--surface-2); color:var(--muted)}
.field label{display:block; font-size:.8rem; font-weight:700; color:var(--muted); margin-bottom:6px}
.field input,.field textarea,.field select{width:100%; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; color:var(--ink)}
.field textarea{resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none; border-color:var(--accent)}
.pre{display:flex; align-items:center; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; overflow:hidden}
.pre span{padding-left:12px; color:var(--muted); font-size:.88rem; white-space:nowrap}
.pre input{border:0 !important; background:transparent !important; padding-left:2px !important}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.copybox{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 12px; min-width:0}
.copybox code{font-family:var(--f); font-weight:700; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}

/* alerts */
.alerts{display:grid; gap:10px}
.alert{display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line)}
.alert .dot{width:10px; height:10px; border-radius:50%; flex:none}
.alert p{flex:1; font-size:.88rem; font-weight:600; min-width:0}
.alert p small{display:block; color:var(--muted); font-weight:500}

/* charts */
.chart{position:relative}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.chart text{fill:var(--muted); font-size:11px; font-family:var(--f)}
.chart .gl{stroke:var(--grid); stroke-width:1}
.chart .bar{fill:var(--chart)}
.chart .bar.dim{opacity:.32}
.mdot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:1px}
.chip.m-rev[aria-pressed="true"]{background:var(--c-rev); border-color:var(--c-rev); color:var(--c-rev-ink)}
.chip.m-sales[aria-pressed="true"]{background:var(--c-sales); border-color:var(--c-sales); color:#fff}
.chip.m-visits[aria-pressed="true"]{background:var(--c-visits); border-color:var(--c-visits); color:#fff}
:root[data-theme="dark"] .chip.m-sales[aria-pressed="true"],:root[data-theme="dark"] .chip.m-visits[aria-pressed="true"]{color:#0B1530}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.m-sales[aria-pressed="true"],:root:not([data-theme="light"]) .chip.m-visits[aria-pressed="true"]{color:#0B1530} }
.chart .hit{fill:transparent; cursor:crosshair}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:.78rem; font-weight:700; padding:7px 10px; border-radius:10px; white-space:nowrap; transform:translate(-50%,-110%); z-index:3}
.tip small{display:block; font-weight:600; opacity:.75}
.hbars{display:grid; gap:12px}
.hb{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center}
.hb .l{font-size:.85rem; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hb .v{font-size:.85rem; font-weight:800; font-variant-numeric:tabular-nums; text-align:right}
.hb .track{grid-column:1 / -1; height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.hb .fill{height:100%; background:var(--chart); border-radius:99px}
.hb small{grid-column:1 / -1; color:var(--muted); font-size:.75rem; margin-top:-2px}
.funnel{display:grid; gap:10px}
.fstep{display:grid; grid-template-columns:150px minmax(0,1fr) 92px; gap:12px; align-items:center}
.fstep .lbl{font-size:.85rem; font-weight:700}
.fstep .lbl small{display:block; color:var(--muted); font-weight:600; font-size:.74rem}
.fstep .barw{height:30px; background:var(--surface-2); border-radius:9px; overflow:hidden}
.fstep .bar{height:100%; background:var(--chart); border-radius:9px; display:flex; align-items:center; padding-left:10px; color:#fff; font-weight:800; font-size:.8rem; min-width:2px}
.fstep .rate{font-size:.78rem; font-weight:700; color:var(--muted); text-align:right}

/* tables / lists */
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:.86rem}
th{text-align:left; font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
td.r,th.r{text-align:right; font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.eb{display:flex; align-items:center; gap:10px; min-width:0}
.eb img{width:52px; height:34px; border-radius:7px; object-fit:cover; flex:none}
.eb b{font-size:.85rem; font-weight:700; line-height:1.25}
.mini{height:6px; background:var(--surface-2); border-radius:99px; margin-top:6px; overflow:hidden; min-width:60px}
.mini i{display:block; height:100%; background:var(--chart); border-radius:99px}

/* CRM */
.tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:4px; width:max-content; max-width:100%; overflow-x:auto}
.tabs button{border:0; background:none; padding:8px 14px; border-radius:10px; font-weight:700; font-size:.86rem; cursor:pointer; color:var(--muted); white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 4px rgba(15,30,61,.08)}
.leads{display:grid; gap:10px}
.lead{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto; gap:14px; align-items:center}
.lead .who b{display:block; font-weight:800}
.lead .who small{color:var(--muted); font-size:.8rem}
.lead .what{font-size:.84rem; min-width:0}
.lead .what small{display:block; color:var(--muted)}
.lead .act{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.lead select{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:6px 8px; font-weight:700; font-size:.8rem}
.lead .notes,.lead2 .notes{grid-column:1 / -1; display:grid; gap:8px; border-top:1px dashed var(--line); padding-top:12px}
.lead .msg,.lead2 .msg{background:var(--surface-2); border-radius:12px; padding:10px 12px; font-size:.84rem}


.pill.gold{background:var(--gold); color:var(--gold-ink)}
.lead2{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:grid; gap:12px}
.l-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.l-who{display:flex; align-items:center; gap:8px; min-width:0}
.l-who b{font-weight:800; font-size:.98rem}
.l-mid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:16px; align-items:center}
.l-mid .sub{font-size:.78rem}
.trail{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.trail li{position:relative; font-size:.74rem; font-weight:700; color:var(--muted); padding-top:12px; line-height:1.25}
.trail li span{position:absolute; top:0; left:0; right:0; height:5px; border-radius:99px; background:var(--good)}
.trail li.stop{color:var(--warn)}
.trail li.stop span{background:var(--warn)}
.l-bot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:12px}
.contact{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:700; font-size:.88rem}
.acts{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.picker-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; background:var(--surface-2); border-radius:12px; padding:10px 12px}
.picker-row input{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:5px 8px; font-size:.8rem}
.hist{margin:6px 0 0; padding-left:18px; font-size:.82rem; color:var(--muted); display:grid; gap:3px}
@media (max-width: 620px){ .l-mid{grid-template-columns:minmax(0,1fr)} .acts .btn{flex:1 1 auto} }


.leads{gap:0 !important}
.lead-wrap{display:grid; grid-template-rows:1fr; transition:grid-template-rows .38s ease, opacity .3s ease, transform .38s ease; padding-bottom:10px}
.lead-wrap.leaving{grid-template-rows:0fr; opacity:0; transform:translateX(24px); padding-bottom:0; transition:grid-template-rows .38s ease, opacity .3s ease, transform .38s ease, padding .38s ease}
.lead-in{min-height:0; overflow:hidden}
.lead2.held{border-color:var(--good)}
.pill.pop{animation:pillpop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pillpop{from{transform:scale(.8); opacity:.2}to{transform:none; opacity:1}}
.done-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--good-soft); color:var(--good); border-radius:12px; padding:10px 12px; font-weight:700; font-size:.88rem; animation:pillpop .3s ease}
.done-bar .ok{width:22px; height:22px; border-radius:50%; background:var(--good); color:var(--surface); display:grid; place-items:center; font-size:.8rem}
.done-bar span:nth-child(2){flex:1; min-width:0}
.result-row,.confirm-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.84rem; font-weight:700; color:var(--muted); background:var(--surface-2); border-radius:12px; padding:8px 10px}
.result-row.hot{background:var(--gold-soft); color:var(--ink); animation:pillpop .3s ease}
.result-row span,.confirm-row span{flex:1 1 180px; min-width:0}
.res-no{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.res-yes{background:var(--accent); color:var(--accent-ink)}
.confirm-row{background:var(--bad-soft); color:var(--ink)}
.res-quit{background:var(--bad); color:#fff}
@media (prefers-reduced-motion: reduce){ .lead-wrap,.lead-wrap.leaving{transition:none} }


.modes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.mode{display:grid; gap:4px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer}
.mode b{font-size:.92rem}
.mode small{color:var(--muted); font-size:.78rem; line-height:1.35}
.mode span{font-weight:800; color:var(--good); font-size:.88rem; margin-top:4px}
.mode[aria-checked="true"]{border-color:var(--accent); box-shadow:0 0 0 3px var(--info-soft)}
.calc{background:var(--surface); border-radius:14px; padding:12px 14px; display:grid; gap:6px}
.calc-line{display:flex; justify-content:space-between; gap:12px; font-size:.88rem}
.calc-line span{color:var(--muted)}
.calc-line.strong{border-top:1px solid var(--line); padding-top:8px; font-size:1rem}
.calc-line.strong span{color:var(--ink); font-weight:700}
.calc-line.strong b{color:var(--good)}
.tipnote{font-size:.8rem; color:var(--muted); margin-top:2px}
.howto{background:var(--surface); border-radius:14px; padding:12px 14px; font-size:.86rem; display:grid; gap:6px}
.howto ol{margin:0; padding-left:20px; display:grid; gap:4px}
.howto small{color:var(--muted); font-size:.78rem}
.warnnote{color:var(--warn) !important; font-weight:700}
.upnf{margin-top:8px; width:max-content}
.sr{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
@media (max-width: 620px){ .modes{grid-template-columns:minmax(0,1fr)} }

/* ledger */
.ledger{display:grid}
.lg-day{font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:14px 0 6px}
.lg{display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.lg .ic{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; font-weight:900}
.lg .ic.in{background:var(--good-soft); color:var(--good)}
.lg .ic.out{background:var(--surface-2); color:var(--ink)}
.lg .ic.ref{background:var(--bad-soft); color:var(--bad)}
.lg b{display:block; font-size:.88rem}
.lg small{color:var(--muted); font-size:.78rem}
.lg .amt{font-weight:800; font-variant-numeric:tabular-nums; text-align:right}
.lg .amt small{display:block; text-align:right; margin-top:2px}
.amt.in{color:var(--good)}
.saque{display:grid; gap:12px; border:1.5px solid var(--gold); background:var(--gold-soft); border-radius:16px; padding:16px}

/* vitrine editor + phone */
.editor{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:22px; align-items:start}
.panel{display:grid; gap:16px}
.two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.swatches{display:flex; gap:8px}
.swatch{width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.upl{display:flex; align-items:center; gap:10px}
.upl input[type=file]{position:absolute; width:1px; height:1px; opacity:0}
.upl-btn{width:58px; height:40px; border-radius:10px; border:1.5px dashed var(--muted); background:var(--surface-2) center/cover no-repeat; display:grid; place-items:center; cursor:pointer; color:var(--accent); font-weight:800; font-size:20px; flex:none}
.upl-btn.round{width:44px; height:44px; border-radius:50%}
.upl:focus-within .upl-btn{outline:3px solid var(--gold); outline-offset:2px}
.upl-t b{display:block; font-size:.84rem}
.upl-t small{font-size:.75rem; color:var(--muted)}
.linkbtn{border:0; background:none; padding:0; color:var(--accent); font-weight:700; font-size:.78rem; cursor:pointer; text-decoration:underline}
.plist{display:grid; gap:6px; max-height:330px; overflow-y:auto; padding-right:4px}
.pick{display:grid; grid-template-columns:auto 52px minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 9px; border-radius:12px; background:var(--surface-2); border:1.5px solid transparent}
.pick.on{border-color:var(--gold)}
.pick.soon{opacity:.5}
.pick input{width:18px; height:18px; accent-color:var(--accent)}
.pick img{width:52px; height:33px; border-radius:6px; object-fit:cover}
.pick .t{font-size:.84rem; font-weight:700; line-height:1.2}
.pick .t small{display:block; color:var(--muted); font-weight:600}
.ord{display:flex; gap:4px; align-items:center}
.ord .pos{font-weight:900; color:var(--warn); width:18px; text-align:center}
.ord button{width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer}
.ord button:disabled{opacity:.35; cursor:default}
.phone{width:280px; height:560px; background:#0A1530; border-radius:42px; padding:11px; box-shadow:0 30px 60px rgba(10,21,48,.35), inset 0 0 0 2px #2A3E66; margin:0 auto}
.screen{background:#fff; color:#16274A; border-radius:32px; height:100%; overflow:hidden; display:flex; flex-direction:column; position:relative}
.notch{position:absolute; top:9px; left:50%; translate:-50% 0; width:84px; height:22px; background:#0A1530; border-radius:99px; z-index:4}
.v-cover{height:104px; flex:none; position:relative; background-size:cover; background-position:center}
.v-cover svg{position:absolute; right:20px; top:24px; width:44px; height:auto}
.v-head{flex:none; padding:0 16px 10px; margin-top:-32px; position:relative; z-index:2}
.avatar{width:64px; height:64px; border-radius:50%; border:4px solid #fff; display:grid; place-items:center; font-weight:900; font-size:21px; color:#fff; background-size:cover; background-position:center}
.v-name{font-weight:900; font-size:17px; margin-top:4px; letter-spacing:-.02em}
.v-url{font-size:10.5px; color:#6A7894; font-weight:600; word-break:break-all}
.v-bio{font-size:11.5px; line-height:1.45; color:#3A4864; margin-top:6px}
.v-social{display:flex; gap:6px; margin-top:8px}
.v-social span{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; background:#EEF3FB}
.v-list{flex:1; min-height:0; overflow-y:auto; padding:6px 12px 14px; display:flex; flex-direction:column; gap:8px}
.v-item{flex:none; display:grid; grid-template-columns:78px minmax(0,1fr); border-radius:13px; overflow:hidden; background:#F3F6FC}
.v-item img{width:100%; height:100%; min-height:60px; object-fit:cover}
.v-item .rw{padding:7px 9px; display:grid; gap:4px; justify-items:start}
.v-item .rw b{font-size:11.5px; line-height:1.2}
.v-item .rw small{font-size:10.5px; color:#6A7894; font-weight:600}
.v-item .rw span{background:#16274A; color:#fff; font-size:10px; font-weight:800; padding:5px 10px; border-radius:99px}
.v-empty{font-size:12px; color:#6A7894; text-align:center; padding:24px 8px}
.qr{background:#fff; border-radius:14px; padding:12px; width:max-content; border:1px solid var(--line)}
.qr svg{display:block; width:132px; height:132px}

/* embaixador / divulgação */
.amb-rule{display:flex; gap:12px; align-items:flex-start; background:var(--gold-soft); border-radius:16px; padding:14px 16px; font-size:.88rem}
.amb-rule b{font-weight:800}
.kit{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.kit-item{border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:8px; background:var(--surface)}
.kit-item b{font-size:.88rem}
.kit-item small{color:var(--muted); font-size:.78rem}
.script{white-space:pre-line; background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:.86rem}
.pcard{width:280px; max-width:100%; aspect-ratio:9/5; background:var(--side); color:#fff; border-radius:16px; padding:16px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center}
.pcard b{font-size:1rem; line-height:1.2}
.pcard small{display:block; color:#AFC2E3; font-size:.72rem; margin-top:6px}
.pcard .qr{padding:6px; border:0}
.pcard .qr svg{width:84px; height:84px}

/* toggles */
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch b{display:block; font-size:.9rem}
.switch small{color:var(--muted); font-size:.8rem}
.switch input{width:40px; height:22px; accent-color:var(--accent); flex:none}

/* modal + toast */
.scrim{position:fixed; inset:0; background:rgba(8,17,39,.55); z-index:70; display:grid; place-items:center; padding:20px}
.modal{background:var(--surface); border-radius:20px; padding:22px; width:min(420px,100%); display:grid; gap:14px}
.receipt{background:var(--surface-2); border-radius:14px; padding:16px; display:grid; gap:6px; font-size:.86rem}
.receipt div{display:flex; justify-content:space-between; gap:12px}
.receipt span{color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:700; font-size:.86rem; z-index:80; box-shadow:0 10px 30px rgba(8,17,39,.3)}

/* mobile chrome */
.topbar,.tabbar,.sheet{display:none}
@media (max-width: 1020px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-21,.editor{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex; align-items:center; justify-content:space-between; position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--side); padding-block:12px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
  .topbar .brand{display:flex; align-items:center; gap:8px}
  .topbar img{height:22px; width:auto}
  .topbar .av{width:32px; height:32px; border-radius:50%; background:#2A4378 center/cover; display:grid; place-items:center; color:#fff; font-weight:800; font-size:12px}
  .tabbar{display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0; background:none; padding:8px 2px 9px; display:grid; justify-items:center; gap:3px; font-size:.68rem; font-weight:700; color:var(--muted); cursor:pointer; position:relative}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .tabbar .badge{position:absolute; top:4px; left:calc(50% + 6px); font-size:10px; font-weight:800; background:var(--gold); color:var(--gold-ink); border-radius:99px; padding:0 6px}
  .sheet{display:block; position:fixed; inset:0; z-index:50; background:rgba(8,17,39,.45)}
  .sheet[hidden]{display:none !important}
  .sheet .in{position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:20px 20px 0 0; padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); display:grid; gap:4px}
  .sheet button{display:flex; gap:12px; align-items:center; border:0; background:none; padding:12px 8px; border-radius:12px; font-weight:700; text-align:left; cursor:pointer}
  .sheet button[aria-current="page"]{background:var(--surface-2)}
  .sheet svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .main{padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
}
@media (max-width: 620px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{gap:10px}
  .kpi strong{font-size:1.25rem}
  .card{padding:16px; border-radius:16px}
  .lead{grid-template-columns:minmax(0,1fr); gap:10px}
  .lead .act{justify-content:flex-start}
  .fstep{grid-template-columns:96px minmax(0,1fr) 64px; gap:8px}
  .two{grid-template-columns:minmax(0,1fr)}
  .phone{width:260px; height:520px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

</head>

/* ===== Regras do programa ===== */
const PRICE = 29.90, RATE = 0.60, AMB_RATE = 0.05, MIN_SAQUE = 50;
const COMMISSION = +(PRICE * RATE).toFixed(2);       // 17,94
const AMB_PER_SALE = +(PRICE * AMB_RATE).toFixed(3); // 1,495
const BASE = "braduca.com.br/";

/* ===== Utilidades ===== */
const brl = v => v.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const nf = v => v.toLocaleString("pt-BR");
const pct = v => (v * 100).toLocaleString("pt-BR", { maximumFractionDigits:1 }) + "%";
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const key = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ===== Saque: regras tributárias (aproximadas, 2026) =====
   PF (RPA): INSS 11% do contribuinte individual, limitado ao teto de R$ 8.475,55 (retenção máx. R$ 932,31);
   IRRF pela tabela progressiva mensal 2026 + redução da Lei 15.270/2025 (isenção efetiva até R$ 5.000; redução parcial até R$ 7.350).
   PJ: Simples Nacional/MEI sem retenção de IR (IN RFB 765/2007); Lucro Presumido/Real: IRRF 1,5% sobre comissões (art. 718, Decreto 9.580/2018),
   dispensado quando o imposto fica em até R$ 10. */
const INSS_RATE = 0.11, INSS_MAX = 932.31, SIMPL = 607.20;
const IR_TABLE = [[2428.80, 0, 0],[2826.65, 0.075, 182.16],[3751.05, 0.15, 394.16],[4664.68, 0.225, 675.49],[Infinity, 0.275, 908.73]];
const CBS_CNPJ = "24.217.073/0001-06";
function irMes(gross, inss){
  if (gross <= 0) return 0;
  const base = Math.max(0, gross - Math.max(inss, SIMPL));
  const [, a, d] = IR_TABLE.find(r => base <= r[0]);
  const tax = Math.max(0, base * a - d);
  const red = gross <= 5000 ? 312.89 : gross <= 7350 ? Math.max(0, 978.62 - 0.133145 * gross) : 0;
  return Math.max(0, tax - Math.min(red, tax));
}
function pfCalc(v, prev = 0){
  const inssAll = Math.min((prev + v) * INSS_RATE, INSS_MAX), inssPrev = Math.min(prev * INSS_RATE, INSS_MAX);
  const inss = inssAll - inssPrev;
  const ir = Math.max(0, irMes(prev + v, inssAll) - irMes(prev, inssPrev));
  return { inss, ir, net:v - inss - ir };
}
function pjCalc(v, regime){
  let irrf = regime === "presumido" ? v * 0.015 : 0;
  if (irrf <= 10) irrf = 0;
  return { irrf, net:v - irrf };
}
const cnpjFmt = v => { const d = v.replace(/\D/g, "").slice(0, 14); return d.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2"); };

function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function Bars({ data, fmt, fmtAxis, height = 220, highlightLast, color }){
  const [hov, setHov] = useState(null);
  const W = 760, H = height, L = 52, R = 8, T = 10, B = 26;
  const max = niceMax(Math.max(...data.map(d => d.v), 0));
  const ticks = [0, max / 2, max];
  const bw = (W - L - R) / Math.max(data.length, 1);
  const gap = Math.min(4, bw * 0.25);
  const every = Math.ceil(data.length / 8);
  const y = v => T + (H - T - B) * (1 - v / max);
  return html`
    <div className="chart" onMouseLeave=${() => setHov(null)}>
      <svg viewBox=${"0 0 " + W + " " + H} role="img" aria-label="Gráfico de barras por dia">
        ${ticks.map(t => html`<g key=${t}><line className="gl" x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} /><text x=${L - 8} y=${y(t) + 4} textAnchor="end">${fmtAxis(t)}</text></g>`)}
        ${data.map((d, i) => {
          const x = L + i * bw + gap / 2, w = Math.max(bw - gap, 1), h = (H - T - B) - (y(d.v) - T);
          const r = Math.min(4, w / 2, h);
          const top = y(d.v);
          const path = h <= 0 ? "" : `M${x},${top + r} a${r},${r} 0 0 1 ${r},${-r} h${w - 2 * r} a${r},${r} 0 0 1 ${r},${r} V${H - B} H${x} Z`;
          const dim = hov !== null ? hov !== i : (highlightLast && i !== data.length - 1);
          return html`<g key=${i}>
            ${path ? html`<path d=${path} className=${"bar" + (dim ? " dim" : "")} style=${color ? { fill:color } : null} />` : null}
            ${(i % every === 0 && data.length - 1 - i >= every / 2) || i === data.length - 1 ? html`<text x=${x + w / 2} y=${H - 8} textAnchor="middle">${d.label}</text>` : null}
            <rect className="hit" x=${L + i * bw} y=${T} width=${bw} height=${H - T - B} onMouseEnter=${() => setHov(i)} onClick=${() => setHov(i)} />
          </g>`;
        })}
      </svg>
      ${hov !== null ? html`<div className="tip" style=${{ left:((L + hov * bw + bw / 2) / W * 100) + "%", top:(y(data[hov].v) / H * 100) + "%" }}><small>${data[hov].full}</small>${fmt(data[hov].v)}</div>` : null}
    </div>`;
}
const HBars = ({ items, fmt }) => {
  const max = Math.max(...items.map(i => i.v), 1);
  return html`<div className="hbars">${items.map(i => html`
    <div className="hb" key=${i.l}><span className="l">${i.l}</span><span className="v">${fmt(i.v)}</span>
      <div className="track"><div className="fill" style=${{ width:(i.v / max * 100) + "%" }}></div></div>
      ${i.s ? html`<small>${i.s}</small>` : null}
    </div>`)}</div>`;
};

function QR({ text, size }){
  const svg = useMemo(() => {
    try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize:4, margin:0, scalable:true }); }
    catch(e){ return ""; }
  }, [text]);
  return svg ? html`<div className="qr" dangerouslySetInnerHTML=${{ __html:svg }}></div>` : html`<div className="qr" style=${{ width:size, height:size }}></div>`;
}

function Desempenho(){
  const [preset, setPreset] = useState("30");
  const [from, setFrom] = useState(addDays(TODAY, -13)), [to, setTo] = useState(TODAY);
  const [metric, setMetric] = useState("rev");
  const [a, b] = rangeOf(preset, from, to);
  const st = stats(a, b);
  const len = st.days.length;
  const pa = addDays(a, -len), pb = addDays(a, -1);
  const prev = pa >= DATA.days[0].d ? stats(pa, pb) : null;
  const dl = (cur, old) => old ? (old === 0 ? null : (cur - old) / old) : null;
  const Delta = ({ v }) => v === null ? html`<div className="delta" style=${{ color:"var(--muted)" }}>sem período anterior</div>` : html`<div className=${"delta " + (v >= 0 ? "up" : "down")}>${v >= 0 ? "▲" : "▼"} ${pct(Math.abs(v))} vs. período anterior</div>`;
  const series = st.days.map(d => {
    const n = st.net.filter(s => s.k === d.k).length;
    const v = metric === "rev" ? n * COMMISSION : metric === "sales" ? n : d.visits;
    const lab = metric === "rev" ? brl(v) : metric === "sales" ? n + " vendas" : d.visits + " visitas";
    return { label:ddmm(d.d), full:dayLabel(d.d), v, lab };
  });
  const fmt = metric === "rev" ? brl : metric === "sales" ? (v => nf(v) + " vendas") : (v => nf(v) + " visitas");
  const fmtAxis = metric === "rev" ? (v => "R$ " + Math.round(v)) : (v => nf(Math.round(v)));
  const per = EBOOKS.filter(e => !e.soon).map(e => {
    const clicks = st.days.reduce((s, d) => s + (d.clicksBy[e.id] || 0), 0);
    const sales = st.net.filter(s => s.ebook === e.id).length;
    return { e, clicks, sales, rev:sales * COMMISSION };
  }).filter(r => r.clicks || r.sales).sort((x, y) => y.rev - x.rev);
  const maxRev = Math.max(...per.map(r => r.rev), 1);
  const src = SOURCES.map(s => { const n = st.net.filter(x => x.src === s.k).length; const v = st.days.reduce((t, d) => t + (d.srcVisits[s.k] || 0), 0); return { l:s.k, v:n, s:nf(v) + " visitas · " + pct(n / Math.max(v, 1)) + " de conversão" }; }).sort((x, y) => y.v - x.v);
  const steps = [
    { l:"Visitas", s:"abriram sua vitrine", v:st.visits },
    { l:"Cliques", s:"num e-book", v:st.clicks },
    { l:"Checkout", s:"preencheram os dados", v:st.checkouts },
    { l:"Compras", s:"pagas", v:st.sales.length }
  ];
  return html`
    <${Head} t="Desempenho" p=${"De " + longDate(a) + " a " + longDate(b) + "."} />
    <div className="row" style=${{ justifyContent:"space-between" }}>
      <div className="chips" role="group" aria-label="Período">${PRESETS.map(p => html`<button key=${p.k} className="chip" aria-pressed=${preset === p.k} onClick=${() => setPreset(p.k)}>${p.t}</button>`)}</div>
      ${preset === "custom" ? html`<div className="row">
        <div className="field" style=${{ display:"flex", gap:"6px", alignItems:"center" }}><label htmlFor="df" style=${{ margin:0 }}>De</label><input id="df" type="date" value=${key(from)} min=${DATA.days[0].k} max=${key(to)} onChange=${e => e.target.value && setFrom(new Date(e.target.value + "T12:00"))} /></div>
        <div className="field" style=${{ display:"flex", gap:"6px", alignItems:"center" }}><label htmlFor="dt" style=${{ margin:0 }}>até</label><input id="dt" type="date" value=${key(to)} min=${key(from)} max=${key(TODAY)} onChange=${e => e.target.value && setTo(new Date(e.target.value + "T12:00"))} /></div>
      </div>` : null}
    </div>
    <div className="g4">
      <div className="card kpi"><small><span className="mdot" style=${{ background:"var(--c-rev)" }}></span>Comissões</small><strong>${brl(st.revenue)}</strong><${Delta} v=${dl(st.revenue, prev && prev.revenue)} /></div>
      <div className="card kpi"><small><span className="mdot" style=${{ background:"var(--c-sales)" }}></span>Vendas</small><strong>${nf(st.net.length)}</strong><${Delta} v=${dl(st.net.length, prev && prev.net.length)} /></div>
      <div className="card kpi"><small><span className="mdot" style=${{ background:"var(--c-visits)" }}></span>Visitas</small><strong>${nf(st.visits)}</strong><${Delta} v=${dl(st.visits, prev && prev.visits)} /></div>
      <div className="card kpi"><small>Conversão</small><strong>${pct(st.net.length / Math.max(st.visits, 1))}</strong><div className="delta" style=${{ color:"var(--muted)" }}>de visita para compra</div></div>
    </div>
    <div className="card">
      <div className="ch"><div><h3>Por dia</h3><p className="sub">Passe o mouse ou toque numa barra para ver o valor.</p></div>
        <div className="chips" role="group" aria-label="Métrica">${[["rev","Comissões"],["sales","Vendas"],["visits","Visitas"]].map(([k, t]) => html`<button key=${k} className=${"chip m-" + k} aria-pressed=${metric === k} onClick=${() => setMetric(k)}><span className="mdot" style=${{ background:"var(--c-" + k + ")" }}></span>${t}</button>`)}</div>
      </div>
      <${Bars} key=${metric} data=${series} fmt=${fmt} fmtAxis=${fmtAxis} color=${"var(--c-" + metric + ")"} />
    </div>
    <div className="g2">
      <div className="card">
        <div className="ch"><div><h3>Onde as pessoas desistem</h3><p className="sub">Do primeiro acesso até a compra paga.</p></div></div>
        <div className="funnel">${steps.map((s, i) => html`<div className="fstep" key=${s.l}>
          <div className="lbl">${s.l}<small>${s.s}</small></div>
          <div className="barw"><div className="bar" style=${{ width:(s.v / Math.max(steps[0].v, 1) * 100) + "%" }}>${nf(s.v)}</div></div>
          <div className="rate">${i ? pct(s.v / Math.max(steps[i - 1].v, 1)) + " seguiram" : ""}</div>
        </div>`)}</div>
      </div>
      <div className="card">
        <div className="ch"><div><h3>De onde vêm as vendas</h3><p className="sub">Vendas pagas por origem do acesso.</p></div></div>
        <${HBars} items=${src} fmt=${v => nf(v) + " vendas"} />
      </div>
    </div>
    <div className="card">
      <div className="ch"><div><h3>Por e-book</h3><p className="sub">Cliques na sua vitrine, vendas e comissões no período.</p></div></div>
      <div className="tbl-wrap"><table>
        <thead><tr><th>E-book</th><th className="r">Cliques</th><th className="r">Vendas</th><th className="r hide-sm">Conversão</th><th className="r">Comissões</th></tr></thead>
        <tbody>${per.map(r => html`<tr key=${r.e.id}>
          <td><div className="eb"><img src=${cover(r.e.id)} alt="" /><div style=${{ minWidth:0 }}><b>${r.e.t}</b><div className="mini"><i style=${{ width:(r.rev / maxRev * 100) + "%" }}></i></div></div></div></td>
          <td className="r">${nf(r.clicks)}</td><td className="r">${nf(r.sales)}</td><td className="r hide-sm">${pct(r.sales / Math.max(r.clicks, 1))}</td><td className="r"><b>${brl(r.rev)}</b></td>
        </tr>`)}</tbody>
      </table></div>
    </div>`;
}

const ST = {
  aberto:{ t:"Em aberto", c:"warn" },
  conversa:{ t:"Em conversa", c:"info" },
  semresposta:{ t:"Não respondeu", c:"mute" },
  retomar:{ t:"Falar novamente", c:"info" },
  rejeitou:{ t:"Rejeitou", c:"bad" }
};
const lastTry = l => l.attempts.length ? l.attempts[l.attempts.length - 1] : null;
const isDue = l => l.status === "retomar" && l.follow && key(l.follow) <= key(TODAY);
const isToDo = l => l.status === "aberto";
const isNew = l => (TODAY - l.d) / 864e5 < 7;
const statusLabel = l => l.status === "retomar" ? (isDue(l) ? (key(l.follow) === key(TODAY) ? "Falar hoje" : "Falar novamente · atrasado") : "Falar em " + ddmm(l.follow)) : ST[l.status].t;
const statusClass = l => l.status === "retomar" && isDue(l) ? "warn" : ST[l.status].c;
const STEPS = ["Escolheu o e-book","Preencheu os dados","Pagamento"];
const reason = st => st.startsWith("Gerou") ? "Gerou o Pix e não pagou" : st.startsWith("Cartão") ? "Cartão recusado" : "Saiu antes de pagar";
const msgFor = (l, profile) => {
  const first = l.name.split(" ")[0], me = profile.name.split(" ")[0], t = byId[l.ebook].t;
  if (l.buyer) return `Oi, ${first}! Aqui é a ${me}. Obrigada por comprar o e-book "${t}". Conseguiu acessar direitinho? Se tiver qualquer dúvida, me chama.`;
  if (l.attempts && l.attempts.length) return `Oi, ${first}! Passando de novo para saber se ainda tem interesse no e-book "${t}". O link continua valendo: ${BASE}${profile.handle}`;
  if (l.stage.startsWith("Gerou")) return `Oi, ${first}! Aqui é a ${me}. Vi que você gerou o Pix do e-book "${t}" e o pagamento não chegou a cair. Quer que eu te mande o link de novo?`;
  if (l.stage.startsWith("Cartão")) return `Oi, ${first}! Aqui é a ${me}. Vi que o cartão não passou na compra do e-book "${t}". Se quiser, dá para pagar no Pix pelo mesmo link: ${BASE}${profile.handle}`;
  return `Oi, ${first}! Aqui é a ${me}. Vi que você se interessou pelo e-book "${t}". Ficou alguma dúvida? Posso te ajudar.`;
};
const phoneFmt = p => "(" + p.slice(0, 2) + ") " + p.slice(2, 7) + "-" + p.slice(7);
const when = (d, h, m) => dayLabel(d) + ", " + String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
const whenD = d => dayLabel(d) + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
const HIST = { semresposta:"Não respondeu", retomar:"Combinou de falar outro dia", rejeitou:"Rejeitou" };

function LeadCard({ l, profile, act, hold, undo, toast }){
  const [more, setMore] = useState(false);
  const [pickDate, setPickDate] = useState(false);
  const [askNo, setAskNo] = useState(false);
  const msg = msgFor(l, profile);
  const stamp = () => { const n = new Date(TODAY); const r = new Date(); n.setHours(r.getHours(), r.getMinutes()); return n; };
  const wa = "https://wa.me/55" + l.phone + "?text=" + encodeURIComponent(msg);
  const start = () => act(l.id, o => ({ attempts:[...o.attempts, stamp()], log:[...(o.log || []), { d:stamp(), t:"Iniciou conversa no WhatsApp" }], status:"conversa", follow:null }), o => o.attempts.length ? "Conversa retomada" : "Conversa iniciada");
  const outcome = (status, extra, label) => act(l.id, o => ({ status, ...extra, log:[...(o.log || []), { d:stamp(), t:label }] }), () => label);
  const later = d => { setPickDate(false); outcome("retomar", { follow:d }, "Falar novamente em " + ddmm(d)); };
  const leaving = hold && hold.phase === "leaving";
  const actions = () => {
    if (l.status === "aberto" || l.status === "semresposta" || l.status === "retomar") return html`<a className="btn btn-wa btn-sm" href=${wa} target="_blank" rel="noopener" onClick=${start}>${l.status === "aberto" ? "Iniciar conversa no WhatsApp" : "Chamar de novo"}</a>`;
    if (l.status === "conversa") return html`<${React.Fragment}>
      <a className="btn btn-ghost btn-sm" href=${wa} target="_blank" rel="noopener">Abrir conversa</a>
    </${React.Fragment}>`;
    return html`<button className="btn btn-ghost btn-sm" onClick=${() => outcome("aberto", { follow:null }, "Contato reaberto")}>Reabrir</button>`;
  };
  return html`<div className=${"lead-wrap" + (leaving ? " leaving" : "")}><div className="lead-in"><div className=${"lead2" + (hold ? " held" : "")}>
    <div className="l-top">
      <div className="l-who"><b>${l.name}</b>${isNew(l) ? html`<span className="pill gold">Novo</span>` : null}</div>
      <span key=${l.status + (l.follow ? key(l.follow) : "")} className=${"pill pop " + statusClass(l)}>${statusLabel(l)}</span>
    </div>
    <div className="l-mid">
      <div className="eb"><img src=${cover(l.ebook)} alt="" /><div style=${{ minWidth:0 }}><b>${byId[l.ebook].t}</b><div className="sub">${brl(PRICE)} · via ${l.src} · ${when(l.d, l.hour, l.min)}</div></div></div>
      <ol className="trail" aria-label="Onde a pessoa parou">${STEPS.map((st, i) => html`<li key=${i} className=${i < 2 ? "done" : "stop"}><span></span>${i < 2 ? st : reason(l.stage)}</li>`)}</ol>
    </div>
    ${hold ? html`<div className="done-bar" role="status"><span className="ok">✓</span><span>${hold.label}</span><button className="linkbtn" onClick=${() => undo(l.id)}>Desfazer</button></div>` : html`<${React.Fragment}>
      <div className="l-bot">
        <div className="contact"><span className="num">${phoneFmt(l.phone)}</span><button className="linkbtn" onClick=${() => copy(phoneFmt(l.phone), toast)}>Copiar</button>${lastTry(l) ? html`<span className="sub">· última conversa ${whenD(lastTry(l))}</span>` : null}</div>
        <div className="acts">${actions()}<button className="btn btn-ghost btn-sm" aria-expanded=${more} onClick=${() => setMore(!more)}>${more ? "Menos" : "Detalhes"}</button></div>
      </div>
      ${l.status === "conversa" ? html`<div className="result-row hot">
        <span>Como ficou a conversa?</span>
        <button className="btn btn-sm res-no" onClick=${() => outcome("semresposta", { follow:null }, "Não respondeu")}>Não respondeu</button>
        <button className="btn btn-sm res-yes" aria-expanded=${pickDate} onClick=${() => { setPickDate(!pickDate); setAskNo(false); }}>Falar novamente…</button>
        <button className="btn btn-sm res-quit" onClick=${() => { setAskNo(true); setPickDate(false); }}>Rejeitou</button>
      </div>` : null}
      ${askNo ? html`<div className="confirm-row"><span>${l.name.split(" ")[0]} não quer comprar? O contato sai da lista.</span><button className="btn btn-sm res-quit" onClick=${() => { setAskNo(false); outcome("rejeitou", { follow:null }, "Marcado como Rejeitou"); }}>Confirmar</button><button className="btn btn-ghost btn-sm" onClick=${() => setAskNo(false)}>Cancelar</button></div>` : null}
      ${pickDate ? html`<div className="picker-row"><span className="sub">Falar novamente:</span>${[[1,"Amanhã"],[3,"Em 3 dias"],[7,"Em 7 dias"]].map(([n, t]) => html`<button key=${n} className="chip" onClick=${() => later(addDays(TODAY, n))}>${t}</button>`)}<input type="date" aria-label="Escolher data" min=${key(addDays(TODAY, 1))} onChange=${e => { if (e.target.value) later(new Date(e.target.value + "T12:00")); }} /></div>` : null}
    </${React.Fragment}>`}
    ${more && !hold ? html`<div className="notes">
      <div><b style=${{ fontSize:".82rem" }}>Mensagem sugerida</b><div className="msg" style=${{ marginTop:"6px" }}>${msg}</div><button className="linkbtn" style=${{ marginTop:"6px" }} onClick=${() => copy(msg, toast)}>Copiar mensagem</button></div>

}

function Clientes({ leads, setLeads, profile, toast }){
  const [tab, setTab] = useState("carrinhos");
  const [filter, setFilter] = useState("aberto");
  const buyers = useMemo(() => DATA.sales.filter(s => s.consent).slice().reverse().slice(0, 40).map(s => ({ ...s, buyer:true })), []);
  const [hold, setHold] = useState({});
  const timers = useRef({});
  const reduced = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const act = (id, patch, label) => {
    const cur = leads.find(l => l.id === id);
    const next = { ...cur, ...(typeof patch === "function" ? patch(cur) : patch) };
    setLeads(ls => ls.map(l => l.id === id ? next : l));
    if (!label) return;
    const t = timers.current[id] || {}; clearTimeout(t.a); clearTimeout(t.b);
    setHold(h => ({ ...h, [id]:{ label:label(cur), prev:cur, phase:"confirm" } }));
    const a = setTimeout(() => setHold(h => h[id] ? { ...h, [id]:{ ...h[id], phase:"leaving" } } : h), 2600);
    const b = setTimeout(() => setHold(h => { const n = { ...h }; delete n[id]; return n; }), reduced ? 2600 : 3000);
    timers.current[id] = { a, b };
  };
  const undo = id => {
    const h = hold[id]; if (!h) return;
    const t = timers.current[id] || {}; clearTimeout(t.a); clearTimeout(t.b);
    setLeads(ls => ls.map(l => l.id === id ? h.prev : l));
    setHold(x => { const n = { ...x }; delete n[id]; return n; });
    toast("Ação desfeita");
  };
  useEffect(() => () => Object.values(timers.current).forEach(t => { clearTimeout(t.a); clearTimeout(t.b); }), []);
  const FILTERS = [
    ["aberto", "Em aberto", l => l.status === "aberto"],
    ["conversa", "Em conversa", l => l.status === "conversa"],
    ["retomar", "Falar novamente", l => l.status === "retomar"],
    ["semresposta", "Não respondeu", l => l.status === "semresposta"],
    ["rejeitou", "Rejeitou", l => l.status === "rejeitou"]
  ];
  const f = FILTERS.find(x => x[0] === filter);
  const base = l => hold[l.id] ? hold[l.id].prev : l;
  const order = l => isDue(l) ? 0 : l.status === "aberto" ? 1 : l.status === "retomar" ? 2 + (l.follow - TODAY) / 864e9 : 3;
  const list = leads.filter(l => f[2](l) || hold[l.id]).slice().sort((a, b) => order(base(a)) - order(base(b)) || (b.d - a.d));
  const contacted = leads.filter(l => l.status !== "aberto").length;
  const replied = leads.filter(l => l.status === "retomar" || l.status === "rejeitou").length;
  return html`
    <${Head} t="Clientes" p="Quem parou no meio da compra e quem já comprou. Só aparecem pessoas que autorizaram contato no checkout." />
    <div className="g3">
      <div className="card kpi"><small>Em aberto</small><strong>${nf(leads.filter(l => l.status === "aberto").length)}</strong><div className="delta" style=${{ color:"var(--muted)" }}>ninguém falou com eles ainda</div></div>
      <div className="card kpi"><small>Em conversa agora</small><strong>${nf(leads.filter(l => l.status === "conversa").length)}</strong><div className="delta" style=${{ color:"var(--muted)" }}>esperando você dizer como ficou</div></div>
      <div className="card kpi"><small>Responderam</small><strong>${pct(replied / Math.max(contacted, 1))}</strong><div className="delta" style=${{ color:"var(--muted)" }}>das pessoas que você chamou</div></div>
    </div>
    <div className="tabs" role="tablist">
      <button role="tab" aria-selected=${tab === "carrinhos"} onClick=${() => setTab("carrinhos")}>Carrinhos abandonados</button>
      <button role="tab" aria-selected=${tab === "compradores"} onClick=${() => setTab("compradores")}>Compradores</button>
    </div>
    ${tab === "carrinhos" ? html`<div style=${{ display:"grid", gap:"14px" }}>
      <div className="chips" role="group" aria-label="Filtrar por status">${FILTERS.map(([k, t, fn]) => html`<button key=${k} className="chip" aria-pressed=${filter === k} onClick=${() => setFilter(k)}>${t} · ${leads.filter(fn).length}</button>`)}</div>
      <div className="leads">${list.length ? list.slice(0, 40).map(l => html`<${LeadCard} key=${l.id} l=${l} profile=${profile} act=${act} hold=${hold[l.id] && (f[2](l) ? { ...hold[l.id], phase:"stay" } : hold[l.id])} undo=${undo} toast=${toast} />`) : html`<div className="card" style=${{ textAlign:"center", color:"var(--muted)" }}>Nenhum contato neste status.</div>`}</div>
    </div>` : html`<div className="leads">${buyers.map(l => html`<${BuyerCard} key=${l.id} l=${l} profile=${profile} toast=${toast} />`)}</div>`}`;
}

function Caixa({ ledger, setExtra, toast, profile, setProfile }){
  const [flt, setFlt] = useState("todos");
  const [ask, setAsk] = useState(false);
  const [val, setVal] = useState("");
  const [mode, setMode] = useState(profile.fiscal.mode);
  const [cnpj, setCnpj] = useState(profile.fiscal.cnpj);
  const [regime, setRegime] = useState(profile.fiscal.regime);
  const [rec, setRec] = useState(null);
  const bal = ledger.reduce((s, e) => s + e.amt, 0);
  const pending = ledger.some(e => e.kind === "out" && e.status !== "pago");
  const mStart = key(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const inM = ledger.filter(e => key(e.d) >= mStart && e.amt > 0).reduce((s, e) => s + e.amt, 0);
  const outM = ledger.filter(e => key(e.d) >= mStart && e.kind === "out").reduce((s, e) => s - e.amt, 0);
  const pfPrev = ledger.filter(e => key(e.d) >= mStart && e.kind === "out" && e.mode === "pf").reduce((s, e) => s - e.amt, 0);
  const v = parseFloat(String(val).replace(/\./g, "").replace(",", ".")) || 0;
  const cnpjOk = cnpj.replace(/\D/g, "").length === 14;
  const err = !val ? "" : v < MIN_SAQUE ? "O saque mínimo é de " + brl(MIN_SAQUE) + "." : v > bal + 0.001 ? "O valor passa do seu saldo." : "";
  const pf = pfCalc(v, pfPrev), pj = pjCalc(v, regime);
  const net = mode === "pf" ? pf.net : pj.net;
  const diff = pj.net - pf.net;
  const canGo = v && !err && (mode === "pf" || cnpjOk);
  const request = () => {
    if (!canGo) return;
    setProfile(p => ({ ...p, fiscal:{ mode, cnpj, regime } }));
    const detail = mode === "pf"
      ? "Retidos " + brl(pf.inss + pf.ir) + " (INSS" + (pf.ir ? " e IR" : "") + ") · você recebe " + brl(pf.net)
      : "CNPJ " + cnpj + (pj.irrf ? " · IR retido " + brl(pj.irrf) : " · sem retenção") + " · você recebe " + brl(pj.net);
    setExtra(x => [...x, { id:"s" + Date.now(), d:TODAY, kind:"out", title:"Saque via Pix · " + (mode === "pf" ? "pessoa física" : "empresa"), detail, amt:-v, net, mode, status:mode === "pj" ? "nota" : "analise" }]);
    setAsk(false); setVal(""); toast(mode === "pj" ? "Saque solicitado. Envie a nota fiscal." : "Saque solicitado");
  };
  const sendNote = (id, file) => { if (!file) return; setExtra(x => x.map(e => e.id === id ? { ...e, status:"analise", nf:file.name } : e)); toast("Nota fiscal enviada"); };
  let rows = ledger.slice().reverse();
  if (flt === "entradas") rows = rows.filter(e => e.amt > 0);
  if (flt === "saidas") rows = rows.filter(e => e.amt < 0);
  const groups = []; rows.slice(0, 80).forEach(e => { const k = key(e.d); const g = groups[groups.length - 1]; if (g && g.k === k) g.items.push(e); else groups.push({ k, d:e.d, items:[e] }); });
  const Line = ({ l, v, neg, strong }) => html`<div className=${"calc-line" + (strong ? " strong" : "")}><span>${l}</span><b className="num">${neg && v ? "− " : ""}${brl(v)}</b></div>`;
  return html`
    <${Head} t="Caixa" p="Tudo o que entrou e saiu do seu saldo." />
    <div className="g3">
      <div className="card kpi hero-bal"><small>Saldo total</small><strong className="num">${brl(bal)}</strong>
        <button className="btn btn-gold btn-sm" style=${{ marginTop:"10px" }} disabled=${bal < MIN_SAQUE || pending} onClick=${() => setAsk(true)}>Solicitar saque</button>
        ${pending ? html`<small style=${{ marginTop:"8px" }}>Você já tem um saque em andamento.</small>` : bal < MIN_SAQUE ? html`<small style=${{ marginTop:"8px" }}>Saque a partir de ${brl(MIN_SAQUE)}.</small>` : html`<small style=${{ marginTop:"8px" }}>Todo o saldo pode ser sacado.</small>`}
      </div>
      <div className="card kpi"><small>Entrou em ${MESES[TODAY.getMonth()]}</small><strong className="up">${brl(inM)}</strong><div className="delta" style=${{ color:"var(--muted)" }}>comissões no mês</div></div>
      <div className="card kpi"><small>Sacado em ${MESES[TODAY.getMonth()]}</small><strong>${brl(outM)}</strong><div className="delta" style=${{ color:"var(--muted)" }}>valor bruto dos saques</div></div>
    </div>
    ${ask ? html`<div className="saque">
      <div className="ch" style=${{ marginBottom:0 }}><h3>Solicitar saque</h3><span className="sub">Saldo total: <b>${brl(bal)}</b></span></div>
      <div className="two">
        <div className="field"><label htmlFor="sv">Quanto quer sacar?</label><div className="pre"><span>R$</span><input id="sv" inputMode="decimal" value=${val} placeholder=${brl(bal).replace("R$", "").trim()} onInput=${e => setVal(e.target.value.replace(/[^0-9.,]/g, ""))} /></div>
          <button className="linkbtn" style=${{ marginTop:"6px" }} onClick=${() => setVal(String(Math.floor(bal * 100) / 100).replace(".", ","))}>Sacar tudo</button></div>
        <div className="field"><label>Vai para a chave Pix</label><div className="pre"><span style=${{ padding:"10px 12px", color:"var(--ink)", fontWeight:700 }}>${profile.pix}</span></div></div>
      </div>
      ${err ? html`<p style=${{ color:"var(--bad)", fontWeight:700, fontSize:".86rem" }}>${err}</p>` : null}
      <div className="field"><label>Como você quer receber?</label>
        <div className="modes" role="radiogroup">
          <button role="radio" aria-checked=${mode === "pf"} className="mode" onClick=${() => setMode("pf")}><b>Pessoa física (CPF)</b><small>A Braduca retém INSS e, se houver, IR. Você não emite nota.</small>${v && !err ? html`<span className="num">Recebe ${brl(pf.net)}</span>` : null}</button>
          <button role="radio" aria-checked=${mode === "pj"} className="mode" onClick=${() => setMode("pj")}><b>Empresa (CNPJ)</b><small>Você emite a nota fiscal. No Simples Nacional não há retenção.</small>${v && !err ? html`<span className="num">Recebe ${brl(pj.net)}</span>` : null}</button>
        </div>
      </div>
      ${mode === "pj" ? html`<div className="two">
        <div className="field"><label htmlFor="scn">CNPJ</label><input id="scn" inputMode="numeric" value=${cnpj} placeholder="00.000.000/0000-00" onInput=${e => setCnpj(cnpjFmt(e.target.value))} />${cnpj && !cnpjOk ? html`<small style=${{ color:"var(--bad)", fontWeight:700 }}>O CNPJ tem 14 números.</small>` : null}</div>
        <div className="field"><label htmlFor="srg">Regime da sua empresa</label><select id="srg" value=${regime} onChange=${e => setRegime(e.target.value)}><option value="simples">Simples Nacional (ME ou EPP)</option><option value="mei">MEI</option><option value="presumido">Lucro Presumido ou Real</option></select></div>
      </div>` : null}
      ${v && !err ? html`<div className="calc">
        <${Line} l="Valor do saque" v=${v} />
        ${mode === "pf" ? html`<${React.Fragment}>
          <${Line} l="INSS (11%)" v=${pf.inss} neg />
          <${Line} l=${pf.ir ? "Imposto de Renda" : "Imposto de Renda (isento nesta faixa)"} v=${pf.ir} neg />
        </${React.Fragment}>` : html`<${Line} l=${pj.irrf ? "IR retido (1,5%)" : "Retenções"} v=${pj.irrf} neg />`}
        <${Line} l="Você recebe no Pix" v=${net} strong />
        ${mode === "pf" && diff > 0.5 ? html`<p className="tipnote">Com CNPJ no Simples Nacional você receberia ${brl(diff)} a mais neste saque. Você ainda pagaria o imposto do Simples na sua empresa.</p>` : null}
      </div>` : null}
      <div className="howto">
        ${mode === "pf" ? html`<${React.Fragment}>
          <b>Como funciona como pessoa física</b>
          <ol>

            <li>Depois de solicitar, emita uma nota fiscal de serviço (NFS-e) no site da prefeitura da sua empresa ou no emissor nacional.</li>
            <li><span>Tomador (quem recebe a nota): <b>CBS · Braduca · CNPJ ${CBS_CNPJ}</b></span> <button className="linkbtn" onClick=${() => copy(CBS_CNPJ, toast)}>Copiar CNPJ</button></li>
            <li>Valor: o valor do saque${v && !err ? html` (<b>${brl(v)}</b>)` : null}.</li>

        </${React.Fragment}>`}
      </div>
      <div className="row"><button className="btn btn-primary" disabled=${!canGo} onClick=${request}>Solicitar ${v && !err ? brl(v) : "saque"}</button><button className="btn btn-ghost" onClick=${() => { setAsk(false); setVal(""); }}>Cancelar</button></div>
      <small className="sub">Valores aproximados. As regras de retenção podem variar conforme a sua situação; em caso de dúvida, fale com um contador.</small>

    </div>

      </div>
      <p className="sub">Na versão final, aqui aparece o arquivo do comprovante anexado pela Braduca.</p>
      <button className="btn btn-primary" onClick=${() => setRec(null)}>Fechar</button>
    </div></div>` : null}`;
}

      <div className="tbl-wrap"><table>
        <thead><tr><th>Indicado</th><th className="hide-sm">Entrou em</th><th className="r">Vendas no mês</th><th className="r">Seus 5% no mês</th><th className="r hide-sm">Total</th></tr></thead>
        <tbody>${rows.map(r => html`<tr key=${r.handle}><td><b>${r.name}</b><div className="sub">${BASE}${r.handle}</div></td><td className="hide-sm">${longDate(r.since)}</td><td className="r">${nf(r.m)}</td><td className="r"><b>${brl(r.m * AMB_PER_SALE)}</b></td><td className="r hide-sm">${brl(r.all * AMB_PER_SALE)}</td></tr>`)}</tbody>
      </table></div>
    </div>`;
}

  vend:"Gancho: \"Fiz minha primeira venda online assim.\"\nMostre a tela do celular com o pedido.\nExplique um passo do e-book em 15 segundos.\nChamada: \"O resto está no e-book, link na bio.\"\nNa legenda: #publi",
  fin:"Gancho: \"3 erros que esvaziam sua conta todo mês.\"\nFale um erro por corte.\nChamada: \"No e-book tem o passo a passo para organizar. Link na bio.\"\nNa legenda: #publi",
  make:"Gancho: \"Maquiagem de 5 minutos para o dia a dia.\"\nFaça a maquiagem acelerada.\nChamada: \"Ensino tudo no e-book AutoMaquiagem, link na bio.\"\nNa legenda: #publi"
};
function Divulgacao({ profile, toast }){
  const [eb, setEb] = useState(profile.ids[0] || "conf");
  const [sug, setSug] = useState(""), [sent, setSent] = useState(false);
  const script = SCRIPTS[eb] || "Gancho: comece pelo resultado que o e-book entrega.\nMostre uma dica rápida do conteúdo.\nChamada: \"O link está na bio.\"\nNa legenda: #publi";
  const link = "https://" + BASE + profile.handle;
  return html`
    <${Head} t="Divulgação" p="Materiais prontos para postar e para mandar junto com seus pedidos." />
    <div className="card">
      <div className="ch"><div><h3>Kit por e-book</h3><p className="sub">Escolha um e-book da sua vitrine.</p></div>
        <div className="field" style=${{ minWidth:"220px" }}><label htmlFor="keb" className="hide-sm" style=${{ display:"none" }}>E-book</label><select id="keb" value=${eb} onChange=${e => setEb(e.target.value)}>${profile.ids.map(id => html`<option key=${id} value=${id}>${byId[id].t}</option>`)}</select></div>
      </div>
      <div className="kit">
        ${[["Capa para stories","1080 × 1920 px"],["Capa para feed","1080 × 1350 px"],["Vídeo curto do autor","15 segundos, vertical"],["Mockup do e-book","PNG com fundo transparente"]].map(([t, s]) => html`
          <div className="kit-item" key=${t}><img src=${cover(eb)} alt="" style=${{ width:"100%", aspectRatio:"16/9", objectFit:"cover", borderRadius:"10px" }} /><b>${t}</b><small>${s}</small><button className="btn btn-ghost btn-sm" onClick=${() => toast("Download disponível na versão final")}>Baixar</button></div>`)}
      </div>
    </div>
    <div className="g2">
      <div className="card">
        <div className="ch"><div><h3>Roteiro para Reels e stories</h3><p className="sub">${byId[eb].t}</p></div><button className="btn btn-ghost btn-sm" onClick=${() => copy(script, toast)}>Copiar</button></div>
        <div className="script">${script}</div>
      </div>
      <div className="card">
        <div className="ch"><div><h3>Cartão para embalagem</h3><p className="sub">Para quem vende na própria loja: imprima e coloque dentro do pedido.</p></div></div>
        <div className="pcard"><div><b>Gostou da compra? Aprenda mais comigo.</b><small>Aponte a câmera para o QR code e veja meus e-books.</small><small>${BASE}${profile.handle}</small></div><${QR} text=${link} size=${84} /></div>
        <button className="btn btn-ghost btn-sm" style=${{ marginTop:"12px" }} onClick=${() => toast("Download disponível na versão final")}>Baixar para imprimir</button>
      </div>
    </div>
    <div className="card">
      <div className="ch"><div><h3>Sugerir um e-book</h3><p className="sub">Seus seguidores ou clientes pedem um assunto? Mande a ideia.</p></div></div>
      ${sent ? html`<p style=${{ fontWeight:700 }}>Recebemos sua sugestão. Obrigado!</p>` : html`<div className="row"><div className="field" style=${{ flex:"1 1 260px" }}><label htmlFor="sg">Assunto</label><input id="sg" value=${sug} placeholder="Ex.: Marmitas fit para a semana" onInput=${e => setSug(e.target.value)} /></div><button className="btn btn-primary" style=${{ alignSelf:"flex-end" }} disabled=${!sug.trim()} onClick=${() => setSent(true)}>Enviar sugestão</button></div>`}
    </div>`;
}

function Conta({ profile, setProfile, amb, setAmb, toast }){
  const [f, setF] = useState({ full:"Ana Paula Ribeiro", email:"ana.doces@email.com", doc:"123.456.789-00", phone:"(85) 99812-3344", pix:profile.pix });

  return html`
    <${Head} t="Minha conta" p="Seus dados, sua chave Pix e as regras do programa." />
    <div className="g2">
      <div className="card panel">
        <h3>Dados pessoais</h3>
        <div className="field"><label htmlFor="cf">Nome completo</label><input id="cf" value=${f.full} onInput=${set("full")} /></div>
        <div className="two">
          <div className="field"><label htmlFor="ce">E-mail</label><input id="ce" type="email" value=${f.email} onInput=${set("email")} /></div>
          <div className="field"><label htmlFor="cp">WhatsApp</label><input id="cp" value=${f.phone} onInput=${set("phone")} /></div>
        </div>
        <div className="field"><label htmlFor="cd">CPF ou CNPJ</label><input id="cd" value=${f.doc} onInput=${set("doc")} /></div>
        <div className="field"><label htmlFor="cx">Chave Pix para receber</label><input id="cx" value=${f.pix} onInput=${set("pix")} /></div>
        <button className="btn btn-primary" style=${{ width:"max-content" }} onClick=${() => { setProfile(p => ({ ...p, pix:f.pix })); toast("Dados salvos"); }}>Salvar dados</button>
      </div>
      <div style=${{ display:"grid", gap:"16px", alignContent:"start" }}>
        <div className="card">
          <h3>Avisar por WhatsApp quando</h3>
          ${[["Uma venda acontecer","Com o e-book e o valor da comissão."],["Um carrinho for abandonado","Para você chamar enquanto o interesse está quente."],["Um saque for pago","Com o comprovante."]].map(([t, s], i) => html`<label className="switch" key=${t}><div><b>${t}</b><small>${s}</small></div><input type="checkbox" defaultChecked=${i !== 0} /></label>`)}
        </div>
        <div className="card">
          <h3>Regras do programa</h3>
          <div className="hbars" style=${{ marginTop:"12px", fontSize:".86rem", gap:"8px" }}>
            <p><b>60% de comissão</b> em cada e-book vendido pela sua vitrine ou cupom (${brl(COMMISSION)}).</p>
            <p><b>Na hora:</b> a comissão entra no saldo assim que a venda é paga.</p>
            <p><b>Saque a partir de ${brl(MIN_SAQUE)},</b> pago em até 2 dias úteis.</p>
            <p><b>Reembolso depois do saque</b> é descontado das próximas vendas.</p>
            <p><b>Seu link não expira.</b> Toda compra feita na sua vitrine é sua.</p>
          </div>
        </div>
        <div className="card">
          <h3>Protótipo</h3>
          <label className="switch"><div><b>Ver como embaixador</b><small>Mostra o menu Embaixador e as comissões de indicados no caixa.</small></div><input type="checkbox" checked=${amb} onChange=${e => setAmb(e.target.checked)} /></label>
        </div>
      </div>
    </div>`;
}

/* ===== App ===== */
function App(){
  const ok = id => VIEWS.some(v => v.id === id);
  const [view, setView] = useState(() => { const h = (location.hash || "").slice(1); return ok(h) ? h : "inicio"; });
  const [amb, setAmb] = useState(true);
  const [sheet, setSheet] = useState(false);
  const [toastMsg, setToastMsg] = useState("");
  const [leads, setLeads] = useState(DATA.leads);
  const [extra, setExtra] = useState([]);
  const [profile, setProfile] = useState({ name:"Ana Doces", handle:"anadoces", bio:"Confeiteira há 8 anos. Ensino doces simples para quem quer começar e para quem quer vender.", insta:"anadoces", tiktok:"anadoces", theme:0, photo:null, cover:null, ids:["conf","vend","fin","make"], coupon:"", pix:"ana.doces@email.com", fiscal:{ mode:"pf", cnpj:"", regime:"simples" } });
  const ledger = useMemo(() => [...buildLedger(amb), ...extra], [amb, extra]);
  const tRef = useRef();
  const toast = m => { setToastMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToastMsg(""), 2200); };
  const views = VIEWS.filter(v => !v.amb || amb);
  const go = id => { setView(id); setSheet(false); try { history.replaceState(null, "", "#" + id); } catch(e){} window.scrollTo(0, 0); };
  useEffect(() => { if (!amb && view === "embaixador") go("inicio"); }, [amb]);
  useEffect(() => { const on = () => { const h = location.hash.slice(1); if (ok(h)) setView(h); }; window.addEventListener("hashchange", on); return () => window.removeEventListener("hashchange", on); }, []);
  const novos = leads.filter(isToDo).length;
  const props = { go, ledger, leads, setLeads, profile, setProfile, toast, amb, setAmb, setExtra };
  const Screen = { inicio:Inicio, vitrine:Vitrine, desempenho:Desempenho, clientes:Clientes, caixa:Caixa, embaixador:Embaixador, divulgacao:Divulgacao, conta:Conta }[view];
  const avStyle = profile.photo ? { backgroundImage:`url(${profile.photo})` } : null;
  const TABS = ["inicio","desempenho","clientes","caixa"];
  return html`
    <div className="shell">
      <aside className="side">
        <div className="brand"><img src=${IMG.logo_w} alt="Braduca" /><span className="tag">creators</span></div>
        <nav className="nav" aria-label="Menu">${views.map(v => html`<button key=${v.id} aria-current=${view === v.id ? "page" : undefined} onClick=${() => go(v.id)}><${Icon} n=${v.id} />${v.t}${v.id === "clientes" && novos ? html`<span className="badge">${novos}</span>` : null}</button>`)}</nav>
        <div className="me"><div className="av" style=${avStyle}>${profile.photo ? null : initials(profile.name)}</div><div><b>${profile.name}</b><small>${amb ? "Embaixadora" : "Creator"}</small></div></div>
      </aside>
      <header className="topbar"><div className="brand"><img src=${IMG.logo_w} alt="Braduca" /><span className="tag">creators</span></div><div className="av" style=${avStyle}>${profile.photo ? null : initials(profile.name)}</div></header>
      <main className="main"><div className="main-in">
        <div className="demo"><span>Protótipo</span>Os números são de exemplo.</div>
        <${Screen} ...${props} key=${view} />
      </div></main>
    </div>
    <nav className="tabbar" aria-label="Menu principal">
      ${TABS.map(id => html`<button key=${id} aria-current=${view === id ? "page" : undefined} onClick=${() => go(id)}><${Icon} n=${id} />${VIEWS.find(v => v.id === id).t}${id === "clientes" && novos ? html`<span className="badge">${novos}</span>` : null}</button>`)}
      <button aria-current=${!TABS.includes(view) ? "page" : undefined} aria-expanded=${sheet} onClick=${() => setSheet(true)}><${Icon} n="mais" />Mais</button>
    </nav>
    <div className="sheet" hidden=${!sheet} onClick=${() => setSheet(false)}>
      <div className="in" onClick=${e => e.stopPropagation()}>${views.filter(v => !TABS.includes(v.id)).map(v => html`<button key=${v.id} aria-current=${view === v.id ? "page" : undefined} onClick=${() => go(v.id)}><${Icon} n=${v.id} />${v.t}</button>`)}</div>
    </div>
    ${toastMsg ? html`<div className="toast" role="status">${toastMsg}</div>` : null}`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>

</body>
